# =====================================================================
#  FloV:MP — шаблон конфига сервера alt:V (движок 16.4.39, ветка release)
#  Копируется в runtime/server/server.toml скриптом assemble-runtime.ps1.
#  Формат восстановлен по открытой документации alt:V + проверен живым
#  стартом (в бэкапе примеров конфига не было — см. docs/server-config.md).
# =====================================================================

name        = "RolePlay Server"
host        = "0.0.0.0"
port        = 7788
players     = 2000
description = "Standalone RolePlay Server"
gamemode    = "RolePlay"
website     = "example-rp.ru"
language    = "ru"

# --- Изоляция: НИКАКИХ обращений к инфраструктуре alt:V ---------------
# Свой independent-мультиплеер: не анонсируемся в мастер-листе (он всё
# равно выключен Take-Two 04.05.2026) и не тянем ничего с их CDN.
announce     = false
useEarlyAuth = false
useCdn       = false
# token намеренно не задан — он нужен только при announce = true.

# Примечание: даже при announce = false движок 16.4.39 после "Server started"
# делает 1-2 фоновых HTTP-запроса и пишет "curl code: 6" (DNS не резолвится).
# Это НЕ блокирует работу сервера — подтверждено живым тестом.

# --- Режим работы ----------------------------------------------------
# debug = true разрешает переподключение из dev-клиента и команду `reconnect`.
# По умолчанию включено для совместимости подключения клиента.
debug = true

# duplicatePlayers: сколько подключений допускать с одного HWID.
duplicatePlayers = 4

# --- Модули движка --------------------------------------------------
# csharp-module — серверный геймод на C# (flovmp-starter / flovmp-core)
# js-module     — клиентские скрипты (flovmp-client)
modules = [
    "csharp-module",
    "js-module",
]

# --- Наши ресурсы (порядок = порядок загрузки) ---------------------
resources = [
    "flovmp-starter",
    "flovmp-client",
]

# --- Оптимизация производительности движка (для 2000+ онлайна) ---
# Ключи верифицированы по бинарнику flovmp-server (alt:V 16.4.39)
streamingDistance = 250
migrationDistance = 120
colShapeTickRate  = 300

[maxStreaming]
peds     = 48
vehicles = 48
objects  = 64

[threads]
streamer    = 2
migration   = 1
syncSend    = 1
syncReceive = 1

# --- Конфигурация модулей --------------------------------------------
[csharp-module]
disableDependencyDownload = true

# Теги мастер-листа не нужны (announce = false), секция оставлена пустой
# как валидный якорь формата.
[tags]

# --- Голосовой чат ----------------------------------------------------
# Секции [voice] здесь раньше НЕ БЫЛО вообще: голосовой сервер разворачивался
# и запускался службой, но игровой сервер о нём не знал — голос не работал ни
# на одной установке, хотя числился готовой возможностью.
#
# Значения ниже — не догадка: они сверены с ЖИВОЙ рабочей установкой
# (/opt/licensee-test на VDS), где голосовой сервер действительно подключается
# и создаёт каналы. Важные детали, на которых легко ошибиться:
#
#   * externalSecret — ЧИСЛО без кавычек, и оно обязано совпадать с secret
#     в voice.toml голосового сервера;
#   * портов ДВА и они разные: externalPort — связь игрового сервера с
#     голосовым (наружу не нужен), externalPublicPort — туда подключаются
#     игроки (обязан быть открыт в файрволе);
#   * externalPublicHost — адрес, который получает КЛИЕНТ. С 127.0.0.1 игроки
#     молча остаются без голоса: клиент пытается подключиться сам к себе.
#
# Парный voice.toml голосового сервера:
#   secret = <то же число>
#   host = "0.0.0.0"
#   port = <externalPort>
#   playerHost = "0.0.0.0"      # именно 0.0.0.0: за NAT публичного IP на
#   playerPort = <externalPublicPort>   # интерфейсе нет
#   loopback = 0
#
# Установщик (scripts/deploy-licensee.sh) заполняет оба файла сам.
[voice]
bitrate            = 32000
externalSecret     = 1
externalHost       = "127.0.0.1"
externalPort       = 7896
externalPublicHost = "CHANGE_ME_PUBLIC_IP_OR_DOMAIN"
externalPublicPort = 7895
