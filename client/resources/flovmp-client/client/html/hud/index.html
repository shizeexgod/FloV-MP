<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>FloV:MP HUD</title>
<script>
(function(){
  var PRESETS = {
    gold:{accent:'#fdd015',dim:'#b3790a',ink:'#1a1206'},
    pink:{accent:'#ff3d8a',dim:'#b3316f',ink:'#1a0410'},
    blue:{accent:'#4ac3ff',dim:'#2e8fdb',ink:'#031420'},
    green:{accent:'#3fd98a',dim:'#22b86b',ink:'#031b10'},
    purple:{accent:'#c084fc',dim:'#8b3fe8',ink:'#1a0f26'},
    red:{accent:'#ff5d5d',dim:'#c23a3a',ink:'#210404'}
  };
  var id = 'gold';
  try { id = localStorage.getItem('flovmp:accent') || 'gold'; } catch (e) {}
  var p = PRESETS[id] || PRESETS.gold;
  var s = document.documentElement.style;
  s.setProperty('--accent', p.accent);
  s.setProperty('--accent-dim', p.dim);
  s.setProperty('--accent-ink', p.ink);
})();
</script>
<style>
  :root {
    --accent: #fdd015;
    --text0: #eef0f6;
    --text1: #b9bed0;
    --panel: rgba(15, 16, 21, .62);
    --stroke: rgba(255, 255, 255, .08);
    --hp: #3fb950;
    --armor: #4aa3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: transparent;
    color: var(--text0);
    overflow: hidden;
    user-select: none;
  }

  .topright {
    position: absolute; top: 18px; right: 20px;
    text-align: right;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 10px 14px;
    backdrop-filter: blur(4px);
  }
  .brand { font-size: 12px; color: var(--text1); letter-spacing: .5px; }
  .brand b { color: var(--accent); }
  .cash { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .meta { font-size: 11px; color: var(--text1); margin-top: 3px; }

  .botleft {
    position: absolute; left: 20px; bottom: 22px;
    width: 190px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 12px 14px;
    backdrop-filter: blur(4px);
  }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar-row .lbl { width: 16px; font-size: 11px; color: var(--text1); }
  .bar {
    flex: 1; height: 8px; border-radius: 5px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; width: 0%; transition: width .25s ease; }
  .bar.hp > i { background: var(--hp); }
  .bar.armor > i { background: var(--armor); }
  .val { width: 26px; text-align: right; font-size: 11px; color: var(--text1); }

  /* Спидометр (в правом нижнем углу) */
  .speedo {
    position: absolute; right: 20px; bottom: 22px;
    width: 220px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
  }
  .speedo.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .speedo-main {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .speed-val-wrap {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .speedo-num {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
    color: var(--text0);
  }
  .speedo-unit {
    font-size: 12px;
    font-weight: 600;
    color: var(--text1);
    letter-spacing: .5px;
  }
  .gear-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 6px;
    background: rgba(255, 255, 255, .1);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .fuel-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fuel-icon {
    font-size: 13px;
    color: var(--text1);
  }
  .bar.fuel {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .1);
  }
  .bar.fuel > i {
    background: var(--accent);
  }
  .fuel-pct {
    font-size: 11px;
    color: var(--text1);
    width: 32px;
    text-align: right;
  }
  .speedo-icons {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, .06);
  }
  .ico {
    font-size: 15px;
    cursor: default;
    transition: color .2s ease, opacity .2s ease;
  }
  .ico.off { color: rgba(255, 255, 255, .25); }
  .ico.on-good { color: #3fb950; }
  .ico.on-warn { color: #f59e0b; }
  .ico.on-bad { color: #ef4444; }
  .ico.on-accent { color: var(--accent); }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  .blink {
    animation: blink 1s infinite;
  }
</style>
</head>
<body>
  <div class="topright">
    <div class="brand">Flo<b>V:MP</b> · <span id="server">—</span></div>
    <div class="cash">$<span id="cash">0</span></div>
    <div class="meta"><span id="clock">00:00</span> · онлайн <span id="online">0</span></div>
  </div>

  <div class="botleft">
    <div class="bar-row">
      <span class="lbl">HP</span>
      <span class="bar hp"><i id="hp-fill"></i></span>
      <span class="val" id="hp-val">0</span>
    </div>
    <div class="bar-row">
      <span class="lbl">AR</span>
      <span class="bar armor"><i id="ar-fill"></i></span>
      <span class="val" id="ar-val">0</span>
    </div>
  </div>

  <div class="speedo" id="speedo">
    <div class="speedo-main">
      <div class="speed-val-wrap">
        <span class="speedo-num" id="speedo-val">0</span>
        <span class="speedo-unit">КМ/Ч</span>
      </div>
      <span class="gear-badge" id="speedo-gear">N</span>
    </div>
    <div class="fuel-row">
      <span class="fuel-icon">⛽</span>
      <span class="bar fuel"><i id="fuel-fill" style="width: 100%;"></i></span>
      <span class="fuel-pct"><span id="speedo-fuel">100</span>%</span>
    </div>
    <div class="speedo-icons">
      <span class="ico off" id="speedo-seatbelt" title="Ремень (B)">⛊</span>
      <span class="ico on-good" id="speedo-engine" title="Двигатель (2)">⚡</span>
      <span class="ico on-bad" id="speedo-lock" title="Замок (L)">🔒</span>
      <span class="ico off" id="speedo-lights" title="Фары">💡</span>
    </div>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  var PRESETS = {
    gold:{accent:'#fdd015',dim:'#b3790a',ink:'#1a1206'},
    pink:{accent:'#ff3d8a',dim:'#b3316f',ink:'#1a0410'},
    blue:{accent:'#4ac3ff',dim:'#2e8fdb',ink:'#031420'},
    green:{accent:'#3fd98a',dim:'#22b86b',ink:'#031b10'},
    purple:{accent:'#c084fc',dim:'#8b3fe8',ink:'#1a0f26'},
    red:{accent:'#ff5d5d',dim:'#c23a3a',ink:'#210404'}
  };

  if (typeof alt !== "undefined") {
    alt.on("flovmp:hud:init", function (serverName) {
      $("server").textContent = serverName || "—";
    });

    alt.on("flovmp:hud:tick", function (hp, armor, cash, online, hour, minute) {
      $("hp-fill").style.width = Math.max(0, Math.min(100, hp)) + "%";
      $("ar-fill").style.width = Math.max(0, Math.min(100, armor)) + "%";
      $("hp-val").textContent = hp;
      $("ar-val").textContent = armor;
      $("cash").textContent = Number(cash).toLocaleString("ru-RU");
      $("online").textContent = online;
      $("clock").textContent = pad(hour) + ":" + pad(minute);
    });

    alt.on("flovmp:hud:speedo", function (show, speed, fuel, gear, engine, locked, seatbelt, lights) {
      var el = $("speedo");
      if (!show) {
        el.classList.remove("active");
        return;
      }
      el.classList.add("active");
      $("speedo-val").textContent = speed;
      $("speedo-fuel").textContent = Math.round(fuel);
      $("fuel-fill").style.width = Math.max(0, Math.min(100, fuel)) + "%";

      var gText = gear === 0 ? "R" : (gear === -1 ? "N" : String(gear));
      $("speedo-gear").textContent = gText;

      var sb = $("speedo-seatbelt");
      if (seatbelt) {
        sb.className = "ico on-good";
        sb.title = "Ремень пристёгнут";
      } else {
        sb.className = "ico on-warn blink";
        sb.title = "Пристегните ремень [B]";
      }

      var eng = $("speedo-engine");
      if (engine) {
        eng.className = "ico on-good";
        eng.title = "Двигатель заведён [2]";
      } else {
        eng.className = "ico on-bad";
        eng.title = "Двигатель заглушен [2]";
      }

      var lk = $("speedo-lock");
      if (locked) {
        lk.className = "ico on-bad";
        lk.textContent = "🔒";
        lk.title = "Двери заперты [L]";
      } else {
        lk.className = "ico on-good";
        lk.textContent = "🔓";
        lk.title = "Двери открыты [L]";
      }

      var lt = $("speedo-lights");
      if (lights) {
        lt.className = "ico on-accent";
      } else {
        lt.className = "ico off";
      }
    });

    alt.on("flovmp:settings:accent", function (colorId) {
      var p = PRESETS[colorId] || PRESETS.gold;
      var s = document.documentElement.style;
      s.setProperty('--accent', p.accent);
      s.setProperty('--accent-dim', p.dim);
      s.setProperty('--accent-ink', p.ink);
      try { localStorage.setItem('flovmp:accent', colorId); } catch(e) {}
    });
  }
</script>
</body>
</html>
