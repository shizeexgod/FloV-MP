<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloV:MP Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .font-mono {
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* ─── BASE WINDOW ────────────────────────────────────────── */
    #console-window {
      position: absolute;
      top: 16px;
      right: 16px;
      left: auto;
      transform: none;
      width: 480px;
      height: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity 0.1s ease, transform 0.1s ease;
      animation: modalFadeIn 0.1s ease-out;
    }

    #console-window.hidden {
      display: none !important;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── ТЕМА 1: OBSIDIAN MINIMALIST (LINEAR / VERCEL) ───────── */
    #console-window.theme-obsidian {
      background: #09090b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85);
    }
    #console-window.theme-obsidian #window-header {
      background: #111115;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    #console-window.theme-obsidian #filter-bar {
      background: #0d0d11;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    #console-window.theme-obsidian #logs-area {
      background: #060608;
    }
    #console-window.theme-obsidian #input-bar {
      background: #0f0f13;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* ─── ТЕМА 2: SLATE TERMINAL (RAYCAST / WARP) ─────────────── */
    #console-window.theme-slate {
      background: #0d1117;
      border: 1px solid #21262d;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }
    #console-window.theme-slate #window-header {
      background: #161b22;
      border-bottom: 1px solid #21262d;
    }
    #console-window.theme-slate #filter-bar {
      background: #0f141c;
      border-bottom: 1px solid #1e2430;
    }
    #console-window.theme-slate #logs-area {
      background: #080b0f;
    }
    #console-window.theme-slate #input-bar {
      background: #131822;
      border-top: 1px solid #21262d;
    }

    /* ─── ТЕМА 3: GLASS MONOLITH (VISIONOS / MACOS GLASS) ─────── */
    #console-window.theme-glass {
      background: rgba(8, 8, 12, 0.80);
      backdrop-filter: blur(34px) saturate(180%);
      -webkit-backdrop-filter: blur(34px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.95);
    }
    #console-window.theme-glass #window-header {
      background: rgba(18, 18, 26, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #console-window.theme-glass #filter-bar {
      background: rgba(12, 12, 18, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    #console-window.theme-glass #logs-area {
      background: rgba(4, 4, 7, 0.45);
    }
    #console-window.theme-glass #input-bar {
      background: rgba(14, 14, 20, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ─── HEADER BAR ─────────────────────────────────────────── */
    #window-header {
      height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }
    #window-header:active {
      cursor: grabbing;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #f4f4f5;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .role-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
    }
    .role-badge.role-admin {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: 6px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #71717a;
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }
    .tab-btn:hover {
      color: #e4e4e7;
      background: rgba(255, 255, 255, 0.04);
    }
    .tab-btn:active {
      transform: scale(0.97);
    }
    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* Metric Pills */
    .metric-pill {
      font-size: 10.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 2px 7px;
      border-radius: 5px;
      color: #71717a;
    }
    .metric-pill strong {
      color: #e4e4e7;
      font-weight: 600;
    }

    /* Header Action Buttons */
    .hdr-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #a1a1aa;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }
    .hdr-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.14);
    }
    .hdr-btn:active {
      transform: scale(0.96);
    }
    .hdr-btn-close {
      background: transparent;
      border: none;
      color: #71717a;
      width: 26px;
      height: 26px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.12s ease, background 0.12s ease, transform 0.08s ease;
    }
    .hdr-btn-close:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .hdr-btn-close:active {
      transform: scale(0.94);
    }

    /* ─── SUB-BAR: FILTERS & SEARCH ───────────────────────────── */
    #filter-bar {
      height: 34px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .filter-tags {
      display: flex;
      gap: 3px;
    }
    .filter-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: transparent;
      color: #71717a;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.1s ease;
    }
    .filter-tag:hover {
      color: #d4d4d8;
      background: rgba(255, 255, 255, 0.04);
    }
    .filter-tag.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.20);
    }

    .search-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      color: #f4f4f5;
      outline: none;
      width: 170px;
    }
    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* ─── LOGS AREA ──────────────────────────────────────────── */
    #logs-area {
      flex: 1;
      padding: 10px 14px;
      overflow-y: auto;
      font-size: 11.5px;
      line-height: 1.55;
      user-select: text;
      -webkit-user-select: text;
    }
    .log-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 2px 8px;
      border-left: 2px solid transparent;
      border-radius: 3px;
      margin-bottom: 2px;
      word-break: break-word;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .log-row-new {
      animation: logRowAppear 0.16s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes logRowAppear {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .log-row-cmd {
      background: rgba(255, 255, 255, 0.045);
      border-left-color: rgba(255, 255, 255, 0.45);
    }
    .log-row-cmd .log-msg {
      color: #ffffff;
      font-weight: 500;
    }
    .log-row-cmd.log-row-new {
      animation: cmdAppear 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cmdAppear {
      from {
        opacity: 0;
        transform: translateY(3px);
        background: rgba(255, 255, 255, 0.09);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        background: rgba(255, 255, 255, 0.045);
      }
    }
    .log-time {
      color: #52525b;
      font-size: 10.5px;
      width: 66px;
      min-width: 66px;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .log-tag {
      font-size: 9.5px;
      font-weight: 700;
      width: 56px;
      min-width: 56px;
      height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
      padding: 0;
    }
    .log-tag-CORE      { color: #d4d4d8; }
    .log-tag-NET       { color: #94a3b8; }
    .log-tag-SYNC      { color: #cbd5e1; }
    .log-tag-SPATIAL   { color: #a1a1aa; }
    .log-tag-HOTRELOAD { color: #f4f4f5; }
    .log-tag-DEV       { color: #e4e4e7; }
    .log-tag-CMD       { color: #ffffff; }
    .log-tag-CHAT      { color: #38bdf8; }
    .log-tag-WARN      { color: #fef08a; background: rgba(254, 240, 138, 0.08); border-color: rgba(254, 240, 138, 0.2); }
    .log-tag-ERR       { color: #fca5a5; background: rgba(252, 165, 165, 0.08); border-color: rgba(252, 165, 165, 0.2); }

    .log-msg {
      color: #e4e4e7;
    }

    /* ─── DEVTOOLS PANEL (ADMIN ONLY) ────────────────────────── */
    .devtools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px;
    }
    .devtools-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .devtools-card-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 5px;
    }
    .devtools-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.1s ease;
    }
    .devtools-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .devtools-btn-white {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-weight: 600;
    }
    .devtools-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .devtools-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 11px;
      color: #ffffff;
      outline: none;
    }
    .devtools-input:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* ─── AUTOCOMPLETE & INPUT ───────────────────────────────── */
    #autocomplete-popup {
      position: absolute;
      bottom: 48px;
      left: 12px;
      right: 12px;
      background: rgba(15, 15, 18, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
      display: none;
      flex-direction: column;
      max-height: 160px;
      overflow-y: auto;
      z-index: 50;
      animation: acSlideUp 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes acSlideUp {
      from {
        opacity: 0;
        transform: translateY(4px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .ac-item {
      padding: 6px 12px;
      font-size: 11.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #a1a1aa;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.12s ease, padding-left 0.14s ease, color 0.12s ease;
    }
    .ac-item:hover, .ac-item.selected {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding-left: 16px;
    }
    .ac-item strong {
      color: #ffffff;
    }
    .ac-desc {
      font-size: 9.5px;
      color: #71717a;
    }

    #input-bar {
      height: 44px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .prompt-label {
      color: #a1a1aa;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 12.5px;
    }
    .cmd-input::placeholder {
      color: #52525b;
    }
    .key-badge, kbd {
      font-family: inherit;
      font-size: 9.5px;
      color: #a1a1aa;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.2px;
    }

    /* React Bits: Dot Grid Pattern */
    .dot-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* React Bits: Shiny Shimmer Badge for Admin */
    .role-badge.role-admin {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }
    .role-badge.role-admin::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shinyBadgeSweep 3.8s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes shinyBadgeSweep {
      0%, 40% { transform: translateX(-100%); }
      70%, 100% { transform: translateX(200%); }
    }

    /* 21st.dev: Smooth Input Bar Glow on Focus */
    #input-bar {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Minimal View Fade-In */
    .view-content {
      animation: tabFadeIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes tabFadeIn {
      from {
        opacity: 0.8;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #input-bar:focus-within {
      border-top-color: rgba(255, 255, 255, 0.22) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    #input-bar.input-send-flash {
      border-top-color: rgba(255, 255, 255, 0.45) !important;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.08);
      transition: all 0.1s ease-out;
    }

    /* ─── RBAC: Скрытие админ-элементов для обычных игроков ─── */
    .admin-only {
      display: none !important;
    }
    #console-window.is-admin .admin-only {
      display: inline-flex !important;
    }
  </style>
</head>
<body>

  <!-- Console Window Container (По умолчанию Theme 1: Obsidian) -->
  <div id="console-window" class="theme-obsidian">
    
    <!-- Top Header -->
    <div id="window-header">
      <div class="brand-group">
        <span class="brand-title font-mono">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          FloV:MP
        </span>

        <span id="user-role-badge" class="role-badge font-mono">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span id="user-role-text">ИГРОК</span>
        </span>

        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchTab('logs', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            Логи
          </button>
          <button class="tab-btn" onclick="switchTab('net', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Сеть &amp; FPS
          </button>
          <button class="tab-btn" onclick="switchTab('entities', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            Сущности
          </button>
          <button class="tab-btn" onclick="switchTab('hotreload', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l6.07-5.19"></path></svg>
            Hot-Reload
          </button>
          <button class="tab-btn admin-only" onclick="switchTab('devtools', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Дев-тулс
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 5px;">
        <!-- Быстрые действия (только для админов) -->
        <button class="hdr-btn admin-only font-mono" onclick="execCmd('tpm')" title="Телепорт к метке на карте">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
          TPM
        </button>
        <button class="hdr-btn admin-only font-mono" onclick="execCmd('noclip')" title="Свободный полет камеры (F4)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          F4
        </button>
        <button class="hdr-btn admin-only font-mono" onclick="execCmd('pos')" title="Скопировать координаты">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          POS
        </button>

        <!-- Метрики -->
        <div class="metric-pill font-mono">
          <span id="val-fps">60</span>
          <span style="color:#71717a; font-size: 9px;">FPS</span>
        </div>
        <div class="metric-pill font-mono">
          <span id="val-ping">14 ms</span>
        </div>

        <!-- Очистить -->
        <button class="hdr-btn font-mono" onclick="clearLogs()" title="Очистить лог">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>

        <!-- Выход из игры -->
        <button class="hdr-btn-close" style="color: #f87171; border-color: rgba(248, 113, 113, 0.25);" onclick="quitGame()" title="Выйти из игры">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>

        <!-- Закрыть -->
        <button class="hdr-btn-close" onclick="closeConsole()" title="Закрыть (F8 / Esc)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- Sub-bar with Filters & Search -->
    <div id="filter-bar">
      <div class="filter-tags font-mono">
        <button class="filter-tag active" onclick="setFilter('ALL')">Все</button>
        <button class="filter-tag" onclick="setFilter('CORE')">Core</button>
        <button class="filter-tag" onclick="setFilter('NET')">Net</button>
        <button class="filter-tag" onclick="setFilter('SYNC')">Sync</button>
        <button class="filter-tag" onclick="setFilter('WARN')">Предупреждения</button>
        <button class="filter-tag" onclick="setFilter('ERR')">Ошибки</button>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="text" id="search-input" class="search-input font-mono" placeholder="Поиск по логам..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- Logs Area with React Bits Dot Grid Background -->
    <div id="logs-area" class="font-mono dot-grid"></div>

    <!-- Autocomplete Popup -->
    <div id="autocomplete-popup" class="font-mono"></div>

    <!-- Input Bar with 21st.dev Command Keycaps -->
    <div id="input-bar">
      <span class="prompt-label font-mono">&gt;</span>
      <input type="text" id="cmd-input" class="cmd-input font-mono" placeholder="Введите команду (/noclip, /heal, /car, /tp, help, quit)..." autocomplete="off" spellcheck="false">
      <div style="display: flex; align-items: center; gap: 5px;">
        <kbd class="font-mono">Tab</kbd>
        <kbd class="font-mono">↵ Enter</kbd>
        <kbd class="font-mono">F8 / Esc</kbd>
      </div>
    </div>

  </div>

  <script>
    // ─── СОСТОЯНИЕ И БЕЗОПАСНОСТЬ ─────────────────────────────
    let adminLevel = 0; // По умолчанию обычный игрок
    const win = document.getElementById('console-window');
    const roleBadge = document.getElementById('user-role-badge');
    const roleText = document.getElementById('user-role-text');

    function openConsole() {
      win.classList.remove('hidden');
      setTimeout(() => {
        try { cmdInput.focus(); } catch (e) { }
      }, 10);
    }

    function closeConsole() {
      win.classList.add('hidden');
      if ('alt' in window) {
        alt.emit('flovmp:console:close');
      }
    }

    function quitGame() {
      if ('alt' in window) {
        alt.emit('flovmp:console:quit');
      }
    }

    function applyPermissions(level) {
      adminLevel = Number(level) || 0;
      if (adminLevel >= 1) {
        win.classList.add('is-admin');
        roleBadge.classList.add('role-admin');
        roleText.innerText = adminLevel >= 8 ? 'FOUNDER' : `ADMIN LVL ${adminLevel}`;
        addLog('DEV', `Права администратора подтверждены: Уровень ${adminLevel}`);
      } else {
        win.classList.remove('is-admin');
        roleBadge.classList.remove('role-admin');
        roleText.innerText = 'ИГРОК';
        if (currentTab === 'devtools') {
          switchTab('logs');
        }
      }
    }

    // Слушатель прав и событий от alt-client
    if ('alt' in window) {
      alt.on('flovmp:console:open', () => {
        openConsole();
      });
      alt.on('flovmp:console:close', () => {
        win.classList.add('hidden');
      });
      alt.on('flovmp:console:permissions', (lvl) => {
        applyPermissions(lvl);
      });
      alt.on('flovmp:console:log', (tag, msg) => {
        addLog(tag, msg);
      });
      alt.on('flovmp:console:stats', (fps, ping, tick) => {
        const fpsEl = document.getElementById('val-fps');
        if (fpsEl) fpsEl.innerText = fps;
        const pingEl = document.getElementById('val-ping');
        if (pingEl) pingEl.innerText = `${ping} ms`;
      });
      alt.on('flovmp:console:entities_data', (data) => {
        latestEntities = data;
        if (currentTab === 'entities') renderEntitiesView();
      });
    }

    // ─── 3 ВАРИАНТА ТЕМ ────────────────────────────────────────
    const themes = ['theme-obsidian', 'theme-slate', 'theme-glass'];
    const themeNames = ['Obsidian', 'Slate', 'Glass'];
    let themeIndex = 0;

    function cycleTheme() {
      win.classList.remove(themes[themeIndex]);
      themeIndex = (themeIndex + 1) % themes.length;
      win.classList.add(themes[themeIndex]);
      document.getElementById('theme-name').innerText = themeNames[themeIndex];
      addLog('DEV', `Тема оформления изменена: ${themeNames[themeIndex]}`);
    }

    // ─── БАЗА КОМАНД С РАЗГРАНИЧЕНИЕМ ПРАВ ─────────────────────
    // Обычные команды (доступны игроку)
    const publicCommands = [
      { cmd: 'help', desc: 'Справка по доступным командам' },
      { cmd: 'alogin <password>', desc: 'Авторизация администратора на дежурство' },
      { cmd: 'claimowner <token>', desc: 'Первичная активация прав Основателя' },
      { cmd: 'clear', desc: 'Очистить экран консоли' },
      { cmd: 'cls', desc: 'Очистить экран консоли' },
      { cmd: 'netgraph', desc: 'Статистика сети и частоты кадров (FPS)' },
      { cmd: 'entities', desc: 'Стриминг сущностей вокруг игрока' },
      { cmd: 'pos', desc: 'Координаты игрока для багрепорта' },
      { cmd: 'coords', desc: 'Координаты игрока' },
      { cmd: 'quit', desc: 'Закрыть игру' },
      { cmd: 'reconnect', desc: 'Переподключиться к серверу' }
    ];

    // Админские команды (только adminLevel >= 1)
    const adminCommands = [
      { cmd: 'tpm', desc: 'Телепорт к фиолетовой метке (F5 Waypoint)' },
      { cmd: 'noclip', desc: 'Свободный полет камеры (F4 NoClip)' },
      { cmd: 'esp [0-3]', desc: 'Админ-видение ESP Wallhack (F3)' },
      { cmd: 'revive [id]', desc: 'Реанимировать игрока' },
      { cmd: 'setdim [dim]', desc: 'Установить виртуальный мир (измерение)' },
      { cmd: 'car [model]', desc: 'Заспавнить автомобиль (напр. car adder)' },
      { cmd: 'heal', desc: 'Восстановить 100% HP и брони' },
      { cmd: 'god', desc: 'Режим бессмертия' },
      { cmd: 'weather [type]', desc: 'Смена погоды (EXTRASUNNY, RAIN, THUNDER)' },
      { cmd: 'time [h] [m]', desc: 'Установить игровое время' },
      { cmd: 'hotreload', desc: 'Перезагрузить NUI-интерфейсы' },
      { cmd: 'setadmin [id] [lvl]', desc: 'Выдать админ-права игроку (Ур. 8)' }
    ];

    function getAvailableCommands() {
      return adminLevel >= 1 ? [...publicCommands, ...adminCommands] : publicCommands;
    }

    // ─── ЛОГИ ──────────────────────────────────────────────────
    const logs = [
      { time: '12:00:01', tag: 'CORE', text: 'FloV:MP Standalone Engine v16.4.39 ready' },
      { time: '12:00:01', tag: 'NET', text: 'Session handshake established' },
      { time: '12:00:02', tag: 'SYNC', text: 'AdaptiveTickManager active (60 Hz locked)' },
      { time: '12:00:03', tag: 'DEV', text: 'Console loaded. Press F8 / Esc to toggle' }
    ];

    let currentFilter = 'ALL';
    let searchQuery = '';
    let history = [];
    let historyIndex = -1;
    let acSelectedIndex = -1;
    let filteredCommands = [];

    const logsArea = document.getElementById('logs-area');
    const cmdInput = document.getElementById('cmd-input');
    const acPopup = document.getElementById('autocomplete-popup');

    function renderLogs() {
      let isNearBottom = logsArea.scrollHeight - logsArea.scrollTop - logsArea.clientHeight < 60;
      
      const filtered = logs.filter(item => {
        if (currentFilter !== 'ALL' && item.tag !== currentFilter) return false;
        if (searchQuery && !item.text.toLowerCase().includes(searchQuery) && !item.tag.toLowerCase().includes(searchQuery)) {
          return false;
        }
        return true;
      });

      let html = '';
      filtered.forEach(item => {
        const isCmd = item.tag === 'CMD';
        const cls = isCmd ? 'log-row log-row-cmd' : 'log-row';
        html += `<div class="${cls}">
          <span class="log-time">[${item.time}]</span>
          <span class="log-tag log-tag-${item.tag}">[${item.tag}]</span>
          <span class="log-msg">${escapeHtml(item.text)}</span>
        </div>`;
      });

      logsArea.innerHTML = html;

      if (isNearBottom || logsArea.scrollTop === 0) {
        logsArea.scrollTop = logsArea.scrollHeight;
      }
    }

    function addLog(tag, text, time = null) {
      const now = time || new Date().toTimeString().split(' ')[0];
      const item = { time: now, tag, text };
      logs.push(item);
      if (logs.length > 500) {
        logs.shift();
      }

      if (currentTab === 'logs') {
        const matchesFilter = currentFilter === 'ALL' || item.tag === currentFilter;
        const matchesSearch = !searchQuery || item.text.toLowerCase().includes(searchQuery) || item.tag.toLowerCase().includes(searchQuery);

        if (matchesFilter && matchesSearch) {
          const isNearBottom = (logsArea.scrollHeight - logsArea.scrollTop - logsArea.clientHeight) < 70;
          const row = document.createElement('div');
          const isCmd = tag === 'CMD';
          row.className = isCmd ? 'log-row log-row-cmd log-row-new' : 'log-row log-row-new';
          row.innerHTML = `
            <span class="log-time">[${item.time}]</span>
            <span class="log-tag log-tag-${item.tag}">[${item.tag}]</span>
            <span class="log-msg">${escapeHtml(item.text)}</span>
          `;
          logsArea.appendChild(row);

          if (isNearBottom || logsArea.scrollTop === 0) {
            logsArea.scrollTo({ top: logsArea.scrollHeight, behavior: 'smooth' });
          }
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setFilter(tag) {
      currentFilter = tag;
      document.querySelectorAll('.filter-tag').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toUpperCase() === (tag === 'ALL' ? 'ВСЕ' : tag));
      });
      renderLogs();
    }

    function handleSearch(query) {
      searchQuery = (query || '').trim().toLowerCase();
      renderLogs();
    }

    // ─── ТАБЫ ──────────────────────────────────────────────────
    let currentTab = 'logs';

    function renderNetGraph() {
      logsArea.innerHTML = `
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 12px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: #71717a; font-size: 11px; font-weight: 600;">ПИНГ СЕТИ (RTT)</span>
                <strong style="color: #f4f4f5; font-size: 13px;" id="net-ping-val">14 ms</strong>
              </div>
              <div style="font-size: 10px; color: #52525b; line-height: 1.6;">
                <div>Потеря пакетов: 0.0%</div>
                <div>Джиттер: 0.8 ms</div>
                <div>Трафик: In 18.2 KB/s · Out 4.8 KB/s</div>
              </div>
            </div>

            <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 12px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: #71717a; font-size: 11px; font-weight: 600;">РЕНДЕРИНГ (FPS)</span>
                <strong style="color: #f4f4f5; font-size: 13px;" id="net-fps-val">60 FPS</strong>
              </div>
              <div style="font-size: 10px; color: #52525b; line-height: 1.6;">
                <div>FrameTime: 16.6 ms</div>
                <div>Частота тиков: 60.0 Hz</div>
                <div>Adaptive Tick: Synchronized</div>
              </div>
            </div>
          </div>

          <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 10px; font-size: 10.5px; color: #a1a1aa; line-height: 1.6;">
            <div><strong>Протокол:</strong> FloV:MP Standalone Sync Protocol v16.4.39</div>
            <div><strong>Сокет:</strong> Multiplexed UDP/TCP · Сжатие: LZ4 · MTU: 1400</div>
          </div>
        </div>
      `;
    }

    let latestEntities = [];
    function renderEntitiesView() {
      const rows = latestEntities && latestEntities.length > 0
        ? latestEntities.map(e => `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.04);">
              <td style="padding: 5px; color: #a1a1aa;">${e.cell}</td>
              <td style="padding: 5px;">${e.type}</td>
              <td style="padding: 5px;">${e.id}</td>
              <td style="padding: 5px;">${e.dist}</td>
              <td style="padding: 5px; color: #e4e4e7;">${e.status}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="5" style="padding: 16px; text-align: center; color: #52525b;">Нет стримируемых сущностей рядом</td></tr>`;

      logsArea.innerHTML = `
        <div style="padding: 12px;">
          <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: left;">
            <thead>
              <tr style="border-bottom: 1px solid rgba(255,255,255,0.08); color: #71717a;">
                <th style="padding: 5px;">Сетка</th>
                <th style="padding: 5px;">Тип</th>
                <th style="padding: 5px;">ID</th>
                <th style="padding: 5px;">Дистанция</th>
                <th style="padding: 5px;">Статус</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderHotReloadView() {
      logsArea.innerHTML = `
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #e4e4e7; font-weight: 600; font-size: 11.5px;">NUI LIVE HOT-RELOAD</span>
            <button class="devtools-btn devtools-btn-white" onclick="executeCommand('hotreload')">Перезагрузить все UI</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 10.5px;">
            <div style="display: flex; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 5px;">
              <span>client/html/hud/index.html</span>
              <span style="color: #a1a1aa;">CEF Active</span>
            </div>
            <div style="display: flex; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 5px;">
              <span>client/html/chat/index.html</span>
              <span style="color: #a1a1aa;">CEF Active</span>
            </div>
            <div style="display: flex; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 5px;">
              <span>client/html/console/index.html</span>
              <span style="color: #ffffff;">Current Window</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderDevToolsView() {
      if (adminLevel < 1) {
        logsArea.innerHTML = `
          <div style="padding: 30px; text-align: center; color: #71717a;">
            <div style="font-size: 14px; color: #ef4444; font-weight: 600; margin-bottom: 6px;">Доступ ограничен</div>
            <div>Панель инструментов разработчика доступна только авторизованным администраторам.</div>
          </div>
        `;
        return;
      }

      logsArea.innerHTML = `
        <div class="devtools-grid font-mono">
          <!-- Карточка 1: Перемещение -->
          <div class="devtools-card">
            <div class="devtools-card-title">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              Полет и Телепортация
            </div>
            <div class="devtools-row">
              <button class="devtools-btn devtools-btn-white" style="flex: 1;" onclick="execCmd('noclip')">NoClip (F4 Fly)</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('tpm')">ТП по метке (TPM)</button>
            </div>
            <div class="devtools-row">
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('pos')">Скопировать POS</button>
            </div>
          </div>

          <!-- Карточка 2: Транспорт -->
          <div class="devtools-card">
            <div class="devtools-card-title">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
              Транспорт
            </div>
            <div class="devtools-row">
              <input type="text" id="dev-veh-model" class="devtools-input" value="adder" placeholder="Модель авто...">
              <button class="devtools-btn devtools-btn-white" onclick="execCmd('car ' + document.getElementById('dev-veh-model').value)">Спавн</button>
            </div>
            <div class="devtools-row">
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('car sultanrs')">Sultan RS</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('car t20')">T20</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('car buzzard')">Buzzard</button>
            </div>
          </div>

          <!-- Карточка 3: Персонаж -->
          <div class="devtools-card">
            <div class="devtools-card-title">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              Персонаж
            </div>
            <div class="devtools-row">
              <button class="devtools-btn devtools-btn-white" style="flex: 1;" onclick="execCmd('heal')">Лечение (100% HP+Armor)</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('god')">GodMode (Бессмертие)</button>
            </div>
          </div>

          <!-- Карточка 4: Окружение -->
          <div class="devtools-card">
            <div class="devtools-card-title">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
              Окружение
            </div>
            <div class="devtools-row">
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('weather EXTRASUNNY')">Солнце</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('weather RAIN')">Дождь</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('weather THUNDER')">Гроза</button>
            </div>
            <div class="devtools-row">
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('time 9 0')">09:00</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('time 14 0')">14:00</button>
              <button class="devtools-btn" style="flex: 1;" onclick="execCmd('time 21 0')">21:00</button>
            </div>
          </div>
        </div>
      `;
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        const defaultBtn = document.querySelector(`.tab-btn[onclick*="${tab}"]`);
        if (defaultBtn) defaultBtn.classList.add('active');
      }

      const filterBar = document.getElementById('filter-bar');
      logsArea.classList.remove('view-content');
      void logsArea.offsetWidth;
      logsArea.classList.add('view-content');

      if (tab === 'logs') {
        if (filterBar) filterBar.style.display = 'flex';
        renderLogs();
      } else {
        if (filterBar) filterBar.style.display = 'none';
        if (tab === 'net') renderNetGraph();
        else if (tab === 'entities') renderEntitiesView();
        else if (tab === 'hotreload') renderHotReloadView();
        else if (tab === 'devtools') renderDevToolsView();
      }
    }

    function clearLogs() {
      logs.length = 0;
      renderLogs();
    }

    function copyLogs() {
      const text = logs.map(l => `[${l.time}] [${l.tag}] ${l.text}`).join('\n');
      navigator.clipboard?.writeText(text).then(() => {
        addLog('DEV', 'Все логи скопированы в буфер обмена.');
      }).catch(() => {
        addLog('DEV', 'Логи скопированы.');
      });
    }

    function closeConsole() {
      if ('alt' in window) {
        alt.emit('flovmp:console:close');
      }
    }

    function execCmd(cmd) {
      executeCommand(cmd);
    }

    // ─── КОМАНДНЫЙ ИНТЕРФЕЙС И ВАЛИДАЦИЯ ПРАВ ─────────────────
    function executeCommand(raw) {
      const text = (raw || '').trim();
      if (!text) return;

      const inputBar = document.getElementById('input-bar');
      if (inputBar) {
        inputBar.classList.remove('input-send-flash');
        void inputBar.offsetWidth;
        inputBar.classList.add('input-send-flash');
        setTimeout(() => inputBar.classList.remove('input-send-flash'), 220);
      }

      history.push(text);
      historyIndex = -1;
      addLog('CMD', `> ${text}`);

      const parts = text.split(' ');
      const cmd = parts[0].toLowerCase();

      // Проверка прав на клиенте перед отправкой
      const isAdminCmd = adminCommands.some(ac => ac.cmd.split(' ')[0] === cmd);
      if (isAdminCmd && adminLevel < 1) {
        addLog('ERR', `Доступ запрещен: команда /${cmd} доступна только администраторам.`);
        return;
      }

      if (cmd === 'clear' || cmd === 'cls') {
        clearLogs();
        return;
      }

      if (cmd === 'help') {
        const available = getAvailableCommands();
        addLog('DEV', '─── ДОСТУПНЫЕ КОМАНДЫ ───');
        available.forEach(c => addLog('DEV', `/${c.cmd.padEnd(16)} — ${c.desc}`));
        return;
      }

      if (cmd === 'netgraph') {
        switchTab('net');
        return;
      }

      if (cmd === 'entities') {
        switchTab('entities');
        return;
      }

      if (cmd === 'hotreload') {
        if ('alt' in window) alt.emit('flovmp:console:hotreload');
        return;
      }

      if (cmd === 'quit') {
        if ('alt' in window) alt.emit('flovmp:console:quit');
        return;
      }

      // Отправка в alt-client
      if ('alt' in window) {
        alt.emit('flovmp:console:cmd', text);
      }
    }

    // Обработка клавиатуры в инпуте
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = cmdInput.value;
        cmdInput.value = '';
        hideAutocomplete();
        executeCommand(val);
      } else if (e.key === 'Escape') {
        closeConsole();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        applyAutocomplete();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        navigateHistory(-1);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        navigateHistory(1);
      }
    });

    cmdInput.addEventListener('input', () => {
      updateAutocomplete(cmdInput.value);
    });

    function navigateHistory(dir) {
      if (history.length === 0) return;
      if (historyIndex === -1 && dir === -1) {
        historyIndex = history.length - 1;
      } else {
        historyIndex += dir;
      }
      historyIndex = Math.max(-1, Math.min(historyIndex, history.length - 1));
      cmdInput.value = historyIndex >= 0 ? history[historyIndex] : '';
    }

    function updateAutocomplete(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        hideAutocomplete();
        return;
      }
      const available = getAvailableCommands();
      filteredCommands = available.filter(c => c.cmd.toLowerCase().startsWith(q));
      if (filteredCommands.length === 0) {
        hideAutocomplete();
        return;
      }

      acSelectedIndex = 0;
      let html = '';
      filteredCommands.forEach((c, idx) => {
        html += `<div class="ac-item ${idx === 0 ? 'selected' : ''}" onclick="selectAutocomplete('${c.cmd.split(' ')[0]}')">
          <strong>/${c.cmd}</strong>
          <span class="ac-desc">${c.desc}</span>
        </div>`;
      });
      acPopup.innerHTML = html;
      acPopup.style.display = 'flex';
    }

    function hideAutocomplete() {
      acPopup.style.display = 'none';
      filteredCommands = [];
      acSelectedIndex = -1;
    }

    function selectAutocomplete(cmdName) {
      cmdInput.value = cmdName + ' ';
      hideAutocomplete();
      cmdInput.focus();
    }

    function applyAutocomplete() {
      if (filteredCommands.length > 0 && acSelectedIndex >= 0) {
        selectAutocomplete(filteredCommands[acSelectedIndex].cmd.split(' ')[0]);
      }
    }

    // Инициализация при старте
    renderLogs();
    applyPermissions(0); // Стартуем как обычный игрок
    win.classList.add('hidden'); // По умолчанию скрыта, открывается мгновенно по F8
  </script>
</body>
</html>
