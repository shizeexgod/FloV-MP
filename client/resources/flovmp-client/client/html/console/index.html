<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FloV:MP In-Game Developer Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: transparent;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .font-mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    /* Modern Floating Container (Variant 2) */
    #console-modern {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 880px;
      height: 560px;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.2s ease-out;
    }

    /* Classic Quake Container (Variant 1) */
    #console-classic {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60vh;
      background: rgba(0, 0, 0, 0.94);
      border-bottom: 2px solid #52525b;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      transition: all 0.2s ease-out;
    }

    .hidden { display: none !important; }

    /* Badges & Tags */
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pink { background: rgba(255, 61, 138, 0.2); color: #ff3d8a; border: 1px solid rgba(255, 61, 138, 0.35); }
    .badge-emerald { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-sky { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }

    /* Button styles */
    .tab-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: #f4f4f5; background: rgba(255,255,255,0.06); }
    .tab-btn.active { color: #ffffff; background: rgba(255,255,255,0.12); font-weight: 600; }

    .switch-mode-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #d4d4d8;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .switch-mode-btn:hover { background: rgba(255,255,255,0.18); color: #ffffff; }

    /* Input */
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f4f4f5;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- ============================================================= -->
  <!-- VARIANT 2: Modern FloV:MP Dark Glass Floating HUD (Default)   -->
  <!-- ============================================================= -->
  <div id="console-modern">
    <!-- Top Header -->
    <div style="height: 48px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; background: rgba(24, 24, 27, 0.5);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="badge badge-pink">FloV:MP DevTools</span>
        <button class="tab-btn active" onclick="setTab('logs')">Консоль логов</button>
        <button class="tab-btn" onclick="setTab('net')">Сеть &amp; FPS</button>
        <button class="tab-btn" onclick="setTab('entities')">Сущности SpatialGrid</button>
        <button class="tab-btn" onclick="setTab('hotreload')">Hot-Reload</button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="font-mono" style="font-size: 11px; color: #a1a1aa; display: flex; gap: 10px;">
          <span>TICK: <strong id="m-tick" style="color: #34d399;">60.0 Hz</strong></span>
          <span>PING: <strong id="m-ping" style="color: #34d399;">14 ms</strong></span>
          <span>FPS: <strong id="m-fps" style="color: #38bdf8;">75</strong></span>
        </div>
        <button class="switch-mode-btn font-mono" onclick="toggleStyleMode()">Вид: Quake (F8)</button>
        <button onclick="closeConsole()" style="background: none; border: none; color: #71717a; cursor: pointer; font-size: 16px;">✕</button>
      </div>
    </div>

    <!-- Logs Body -->
    <div id="m-logs" class="font-mono custom-scrollbar" style="flex: 1; padding: 14px; overflow-y: auto; font-size: 12px; line-height: 1.6; user-select: text;">
      <!-- Generated entries go here -->
    </div>

    <!-- Command Input Bar -->
    <div style="padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(18, 18, 22, 0.8); display: flex; align-items: center; gap: 10px;">
      <span class="font-mono" style="color: #ff3d8a; font-weight: 700; font-size: 14px;">&gt;_</span>
      <input type="text" id="m-input" class="cmd-input font-mono" placeholder="Введите команду (netgraph, clear, hotreload, help, quit)..." autocomplete="off" spellcheck="false">
      <span class="font-mono" style="font-size: 10px; color: #71717a; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;">Enter ↵</span>
    </div>
  </div>


  <!-- ============================================================= -->
  <!-- VARIANT 1: Classic FiveM Quake-Style Dropdown Console         -->
  <!-- ============================================================= -->
  <div id="console-classic" class="hidden">
    <!-- Classic Header Bar -->
    <div class="font-mono" style="height: 34px; padding: 0 12px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; font-size: 11px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="color: #fbbf24; font-weight: bold;">● FloV:MP Console (Quake)</span>
        <span style="color: #52525b;">|</span>
        <span style="color: #f4f4f5; cursor: pointer;">Console</span>
        <span style="color: #71717a; cursor: pointer;">Network</span>
        <span style="color: #71717a; cursor: pointer;">Performance</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; color: #a1a1aa;">
        <span>Tick: <strong style="color: #34d399;">60.0 Hz</strong></span>
        <span>Ping: <strong style="color: #34d399;">14 ms</strong></span>
        <button class="switch-mode-btn" onclick="toggleStyleMode()">Вид: Glass</button>
        <span style="color: #52525b;">[F8 закрыть]</span>
      </div>
    </div>

    <!-- Classic Logs Area -->
    <div id="c-logs" class="font-mono custom-scrollbar" style="flex: 1; padding: 12px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #d4d4d8; user-select: text;">
      <!-- Cloned logs -->
    </div>

    <!-- Classic Input -->
    <div style="height: 38px; padding: 0 12px; background: #09090b; border-top: 1px solid #27272a; display: flex; align-items: center; gap: 8px;">
      <span class="font-mono" style="color: #fbbf24; font-weight: bold;">&gt;</span>
      <input type="text" id="c-input" class="cmd-input font-mono" placeholder="Введите команду..." autocomplete="off">
    </div>
  </div>

  <script>
    const logsData = [
      { time: '12:00:01', tag: 'CORE', text: 'FloV:MP Runtime v16.4.39 initialized (x64_win32)', color: 'text-zinc-400' },
      { time: '12:00:01', tag: 'NET', text: 'Connecting to 188.127.229.224:7788... Session: #8849', color: 'text-sky-400' },
      { time: '12:00:02', tag: 'SYNC', text: 'AdaptiveTickManager online: 60 Hz active. Hermite C1 Spline enabled.', color: 'text-emerald-400' },
      { time: '12:00:03', tag: 'SPATIAL', text: 'OcclusionCullingService active: PVS filtering on dimension 0.', color: 'text-purple-400' },
      { time: '12:00:04', tag: 'HOTRELOAD', text: 'NUI Hot-Reload Bridge listening (Ctrl+S auto-refresh enabled)', color: 'text-pink-400' },
      { time: '12:00:05', tag: 'DEV', text: 'In-Game Dev Console ready. Press F8 or F11 to toggle.', color: 'text-amber-400' }
    ];

    let currentMode = 'modern'; // 'modern' or 'classic'
    let history = [];
    let historyIndex = -1;

    function renderLogs() {
      const mLogs = document.getElementById('m-logs');
      const cLogs = document.getElementById('c-logs');
      
      let html = '';
      logsData.forEach(item => {
        html += `<div style="display: flex; gap: 8px; margin-bottom: 4px;">
          <span style="color: #71717a; font-size: 10px;">[${item.time}]</span>
          <span style="font-weight: 600; color: #ff3d8a;">[${item.tag}]</span>
          <span>${item.text}</span>
        </div>`;
      });

      mLogs.innerHTML = html;
      cLogs.innerHTML = html;
      mLogs.scrollTop = mLogs.scrollHeight;
      cLogs.scrollTop = cLogs.scrollHeight;
    }

    function addLog(tag, text, time = null) {
      const now = time || new Date().toTimeString().split(' ')[0];
      logsData.push({ time: now, tag, text });
      renderLogs();
    }

    function toggleStyleMode() {
      const modern = document.getElementById('console-modern');
      const classic = document.getElementById('console-classic');

      if (currentMode === 'modern') {
        currentMode = 'classic';
        modern.classList.add('hidden');
        classic.classList.remove('hidden');
        document.getElementById('c-input').focus();
      } else {
        currentMode = 'modern';
        classic.classList.add('hidden');
        modern.classList.remove('hidden');
        document.getElementById('m-input').focus();
      }
    }

    function setTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'logs') {
        renderLogs();
      } else if (tab === 'net') {
        addLog('NETGRAPH', 'Tick: 60.0 Hz | In: 14.2 KB/s | Out: 4.8 KB/s | RTT: 14ms | Loss: 0%');
      } else if (tab === 'entities') {
        addLog('SPATIAL', 'Grid Cell #14-22: 3 vehicles, 8 peds. Occluded: 2 entities culled.');
      } else if (tab === 'hotreload') {
        addLog('HOTRELOAD', 'Live FileWatcher status: OK. Target: client/ui/ (0 ms reload delay)');
      }
    }

    function executeCommand(cmd) {
      if (!cmd || !cmd.trim()) return;
      const clean = cmd.trim();
      history.push(clean);
      historyIndex = history.length;

      addLog('CMD', clean);

      const parts = clean.split(' ');
      const command = parts[0].toLowerCase();

      switch (command) {
        case 'clear':
        case 'cls':
          logsData.length = 0;
          renderLogs();
          break;
        case 'help':
          addLog('HELP', 'Доступные команды: clear, netgraph, entities, hotreload, quit, reconnect');
          break;
        case 'netgraph':
          addLog('NET', 'Bandwidth: 19.1 KB/s | Tick: 60 Hz | Interpolation Buffer: 40ms');
          break;
        case 'hotreload':
          addLog('HOTRELOAD', 'NUI Cache invalidated. All WebViews refreshed successfully.');
          if ('alt' in window) alt.emit('flovmp:console:hotreload');
          break;
        case 'quit':
          if ('alt' in window) alt.emit('flovmp:console:quit');
          break;
        default:
          if ('alt' in window) {
            alt.emit('flovmp:console:cmd', clean);
          } else {
            addLog('INFO', `Команда '${clean}' отправлена на сервер`);
          }
          break;
      }
    }

    function closeConsole() {
      if ('alt' in window) {
        alt.emit('flovmp:console:close');
      }
    }

    function handleInputKey(e, inputEl) {
      if (e.key === 'Enter') {
        executeCommand(inputEl.value);
        inputEl.value = '';
      } else if (e.key === 'ArrowUp') {
        if (historyIndex > 0) {
          historyIndex--;
          inputEl.value = history[historyIndex];
        }
      } else if (e.key === 'ArrowDown') {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          inputEl.value = history[historyIndex];
        } else {
          historyIndex = history.length;
          inputEl.value = '';
        }
      } else if (e.key === 'Escape') {
        closeConsole();
      }
    }

    document.getElementById('m-input').addEventListener('keydown', (e) => handleInputKey(e, e.target));
    document.getElementById('c-input').addEventListener('keydown', (e) => handleInputKey(e, e.target));

    // alt:V Client Events
    if ('alt' in window) {
      alt.on('flovmp:console:log', (tag, text) => addLog(tag, text));
      alt.on('flovmp:console:stats', (fps, ping, tick) => {
        document.getElementById('m-fps').innerText = fps;
        document.getElementById('m-ping').innerText = ping + ' ms';
        document.getElementById('m-tick').innerText = tick + ' Hz';
      });
    }

    renderLogs();
    document.getElementById('m-input').focus();
  </script>
</body>
</html>
