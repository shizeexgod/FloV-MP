<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloV:MP In-Game Developer Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .font-mono {
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 61, 138, 0.4);
    }

    /* Floating Modern Glass Window (Variant 2) */
    #console-window {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 920px;
      height: 590px;
      min-width: 600px;
      min-height: 400px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 60px);
      background: rgba(10, 10, 14, 0.90);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 1px 1px rgba(255, 61, 138, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Header Bar */
    #window-header {
      height: 46px;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 18, 24, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }
    #window-header:active {
      cursor: grabbing;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #ff3d8a;
      background: rgba(255, 61, 138, 0.14);
      border: 1px solid rgba(255, 61, 138, 0.28);
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff3d8a;
      box-shadow: 0 0 8px #ff3d8a;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .tab-btn:hover {
      color: #f4f4f5;
      background: rgba(255, 255, 255, 0.06);
    }
    .tab-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.12);
      font-weight: 600;
    }

    /* Metric Pills */
    .metric-pill {
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
      color: #a1a1aa;
    }
    .metric-pill strong {
      font-weight: 600;
    }

    /* Header action buttons */
    .hdr-action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #d4d4d8;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .hdr-action-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .hdr-close-btn {
      background: transparent;
      border: none;
      color: #71717a;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.12s ease;
    }
    .hdr-close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* Sub-bar / Filters */
    #filter-bar {
      height: 36px;
      padding: 0 14px;
      background: rgba(14, 14, 18, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .filter-tags {
      display: flex;
      gap: 4px;
    }
    .filter-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: #71717a;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.1s ease;
    }
    .filter-tag:hover {
      color: #d4d4d8;
      background: rgba(255, 255, 255, 0.05);
    }
    .filter-tag.active {
      color: #ffffff;
      background: rgba(255, 61, 138, 0.2);
      border-color: rgba(255, 61, 138, 0.4);
    }

    .search-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: #f4f4f5;
      outline: none;
      width: 170px;
    }
    .search-box:focus {
      border-color: rgba(255, 61, 138, 0.5);
    }

    /* Log Container */
    #logs-area {
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.55;
      user-select: text;
      -webkit-user-select: text;
      background: rgba(6, 6, 9, 0.4);
    }
    .log-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 3px;
      word-break: break-word;
    }
    .log-time {
      color: #52525b;
      font-size: 11px;
      flex-shrink: 0;
    }
    .log-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .log-tag-CORE { background: rgba(161, 161, 170, 0.15); color: #d4d4d8; border: 1px solid rgba(161, 161, 170, 0.25); }
    .log-tag-NET { background: rgba(14, 165, 233, 0.18); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    .log-tag-SYNC { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .log-tag-SPATIAL { background: rgba(168, 85, 247, 0.18); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .log-tag-HOTRELOAD { background: rgba(255, 61, 138, 0.18); color: #ff3d8a; border: 1px solid rgba(255, 61, 138, 0.35); }
    .log-tag-DEV { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .log-tag-CMD { background: rgba(255, 255, 255, 0.12); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
    .log-tag-WARN { background: rgba(245, 158, 11, 0.25); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }
    .log-tag-ERR { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .log-msg {
      color: #e4e4e7;
    }

    /* Autocomplete Popover */
    #autocomplete-popup {
      position: absolute;
      bottom: 54px;
      left: 14px;
      right: 14px;
      background: rgba(15, 15, 20, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      max-height: 160px;
      overflow-y: auto;
      z-index: 50;
    }
    .ac-item {
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #a1a1aa;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .ac-item:hover, .ac-item.selected {
      background: rgba(255, 61, 138, 0.18);
      color: #ffffff;
    }
    .ac-item strong {
      color: #ff3d8a;
    }
    .ac-desc {
      font-size: 10px;
      color: #71717a;
    }

    /* Input Bar */
    #input-bar {
      height: 48px;
      padding: 0 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 14, 18, 0.92);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .prompt-label {
      color: #ff3d8a;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 13px;
    }
    .cmd-input::placeholder {
      color: #52525b;
    }
    .key-badge {
      font-size: 10px;
      color: #71717a;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Modern Floating Console HUD (Variant 2 - Flagship) -->
  <div id="console-window">
    
    <!-- Top Draggable Header -->
    <div id="window-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="brand-badge font-mono">
          <span class="brand-dot"></span>
          <span>FloV:MP Console</span>
        </div>

        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchTab('logs', this)">Логи</button>
          <button class="tab-btn" onclick="switchTab('net', this)">Сеть &amp; FPS</button>
          <button class="tab-btn" onclick="switchTab('entities', this)">Сущности</button>
          <button class="tab-btn" onclick="switchTab('hotreload', this)">Hot-Reload</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="metric-pill font-mono">
          <span>TICK:</span>
          <strong id="val-tick" style="color: #34d399;">60.0 Hz</strong>
        </div>
        <div class="metric-pill font-mono">
          <span>PING:</span>
          <strong id="val-ping" style="color: #38bdf8;">14 ms</strong>
        </div>
        <div class="metric-pill font-mono">
          <span>FPS:</span>
          <strong id="val-fps" style="color: #c084fc;">75</strong>
        </div>

        <button class="hdr-action-btn font-mono" onclick="copyLogs()" title="Копировать все логи в буфер">Копировать</button>
        <button class="hdr-action-btn font-mono" onclick="clearLogs()" title="Очистить экран">Очистить</button>
        <button class="hdr-close-btn" onclick="closeConsole()" title="Закрыть консоль (F8 / F11 / Esc)">✕</button>
      </div>
    </div>

    <!-- Sub-bar with Filters & Search -->
    <div id="filter-bar">
      <div class="filter-tags font-mono">
        <button class="filter-tag active" onclick="setFilter('ALL')">Все</button>
        <button class="filter-tag" onclick="setFilter('CORE')">Core</button>
        <button class="filter-tag" onclick="setFilter('NET')">Net</button>
        <button class="filter-tag" onclick="setFilter('SYNC')">Sync</button>
        <button class="filter-tag" onclick="setFilter('SPATIAL')">Spatial</button>
        <button class="filter-tag" onclick="setFilter('ERR')">Ошибки</button>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="text" id="search-input" class="search-box font-mono" placeholder="Поиск по логам..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- Logs Area -->
    <div id="logs-area" class="font-mono">
      <!-- Injected logs -->
    </div>

    <!-- Autocomplete Popup -->
    <div id="autocomplete-popup" class="font-mono"></div>

    <!-- Input Bar -->
    <div id="input-bar">
      <span class="prompt-label font-mono">&gt;_</span>
      <input type="text" id="cmd-input" class="cmd-input font-mono" placeholder="Введите команду (netgraph, entities, hotreload, clear, help, quit)..." autocomplete="off" spellcheck="false">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="key-badge font-mono">Tab авто</span>
        <span class="key-badge font-mono">Enter ↵</span>
        <span class="key-badge font-mono">F8 / Esc</span>
      </div>
    </div>

  </div>

  <script>
    // Initial seeded logs
    const logs = [
      { time: '12:00:01', tag: 'CORE', text: 'FloV:MP Multiplayer Engine v16.4.39 initialized (x64_win32)' },
      { time: '12:00:01', tag: 'NET', text: 'Connecting to 188.127.229.224:7788... Session handshake established' },
      { time: '12:00:02', tag: 'SYNC', text: 'AdaptiveTickManager active: 60.0 Hz locked. Dynamic rate scaling enabled' },
      { time: '12:00:03', tag: 'SPATIAL', text: 'OcclusionCullingService online: Spatial grid 64m, PVS occlusion loaded' },
      { time: '12:00:04', tag: 'HOTRELOAD', text: 'NUI Hot-Reload Bridge listening (Ctrl+S / hotreload enabled)' },
      { time: '12:00:05', tag: 'DEV', text: 'Modern Glass Developer Console ready. Press F8, F11 or Esc to toggle' }
    ];

    const commandsList = [
      { cmd: 'help', desc: 'Справка по всем доступным командам консоли' },
      { cmd: 'clear', desc: 'Очистить экран и лог консоли (алиас: cls)' },
      { cmd: 'cls', desc: 'Очистить экран и лог консоли' },
      { cmd: 'netgraph', desc: 'Показать подробную статистику сетевого трафика и RTT' },
      { cmd: 'entities', desc: 'Инспектор сущностей SpatialHashGrid в радиусе стриминга' },
      { cmd: 'hotreload', desc: 'Мгновенная перезагрузка NUI-интерфейсов без рестарта' },
      { cmd: 'pos', desc: 'Вывести текущие координаты X, Y, Z и Heading игрока' },
      { cmd: 'quit', desc: 'Закрыть клиент игры и выгрузить процесс' },
      { cmd: 'reconnect', desc: 'Переподключиться к серверу' }
    ];

    let currentFilter = 'ALL';
    let searchQuery = '';
    let history = [];
    let historyIndex = -1;
    let acSelectedIndex = -1;
    let filteredCommands = [];

    const logsArea = document.getElementById('logs-area');
    const cmdInput = document.getElementById('cmd-input');
    const acPopup = document.getElementById('autocomplete-popup');

    function renderLogs() {
      let isNearBottom = logsArea.scrollHeight - logsArea.scrollTop - logsArea.clientHeight < 60;
      
      const filtered = logs.filter(item => {
        if (currentFilter !== 'ALL' && item.tag !== currentFilter) return false;
        if (searchQuery && !item.text.toLowerCase().includes(searchQuery) && !item.tag.toLowerCase().includes(searchQuery)) {
          return false;
        }
        return true;
      });

      let html = '';
      filtered.forEach(item => {
        html += `<div class="log-row">
          <span class="log-time">[${item.time}]</span>
          <span class="log-tag log-tag-${item.tag}">[${item.tag}]</span>
          <span class="log-msg">${escapeHtml(item.text)}</span>
        </div>`;
      });

      logsArea.innerHTML = html;

      // Smart scroll lock
      if (isNearBottom || logsArea.scrollTop === 0) {
        logsArea.scrollTop = logsArea.scrollHeight;
      }
    }

    function addLog(tag, text, time = null) {
      const now = time || new Date().toTimeString().split(' ')[0];
      logs.push({ time: now, tag, text });
      renderLogs();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function setFilter(tag) {
      currentFilter = tag;
      document.querySelectorAll('.filter-tag').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toUpperCase() === (tag === 'ALL' ? 'ВСЕ' : tag));
      });
      renderLogs();
    }

    function handleSearch(query) {
      searchQuery = (query || '').trim().toLowerCase();
      renderLogs();
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        const defaultBtn = document.querySelector(`.tab-btn[onclick*="${tab}"]`);
        if (defaultBtn) defaultBtn.classList.add('active');
      }

      if (tab === 'logs') {
        renderLogs();
      } else if (tab === 'net') {
        addLog('NET', 'Bandwidth: IN: 16.4 KB/s | OUT: 5.2 KB/s | RTT: 14 ms | Jitter: 1.2 ms | Loss: 0.0%');
      } else if (tab === 'entities') {
        addLog('SPATIAL', 'Grid Cell #14-22: 4 vehicles, 12 peds. Culling: 3 entities occluded by interior PVS.');
      } else if (tab === 'hotreload') {
        addLog('HOTRELOAD', 'Live FileWatcher status: OK. All NUI resources linked: chat, hud, auth, inventory, console.');
      }
    }

    function clearLogs() {
      logs.length = 0;
      renderLogs();
    }

    function copyLogs() {
      const text = logs.map(l => `[${l.time}] [${l.tag}] ${l.text}`).join('\n');
      navigator.clipboard?.writeText(text).then(() => {
        addLog('DEV', 'Все логи скопированы в буфер обмена.');
      }).catch(() => {
        addLog('DEV', 'Логи скопированы.');
      });
    }

    function closeConsole() {
      if ('alt' in window) {
        alt.emit('flovmp:console:close');
      }
    }

    function executeCommand(raw) {
      if (!raw || !raw.trim()) return;
      const cmd = raw.trim();
      history.push(cmd);
      historyIndex = history.length;
      hideAutocomplete();

      addLog('CMD', cmd);

      const parts = cmd.split(' ');
      const name = parts[0].toLowerCase();

      switch (name) {
        case 'clear':
        case 'cls':
          clearLogs();
          break;
        case 'help':
          addLog('HELP', 'Команды: help, clear, netgraph, entities, hotreload, pos, quit, reconnect');
          break;
        case 'netgraph':
          addLog('NET', 'Tick: 60.0 Hz | In: 16.4 KB/s | Out: 5.2 KB/s | Ping: 14ms | Interpolation: 40ms');
          break;
        case 'entities':
          addLog('SPATIAL', 'SpatialGrid entities: 16 total (4 vehicles, 12 peds). 3 occluded entities culled.');
          break;
        case 'hotreload':
          addLog('HOTRELOAD', 'CEF cache invalidated. Active WebViews reloaded from disk.');
          if ('alt' in window) alt.emit('flovmp:console:hotreload');
          break;
        case 'quit':
          if ('alt' in window) alt.emit('flovmp:console:quit');
          break;
        default:
          if ('alt' in window) {
            alt.emit('flovmp:console:cmd', cmd);
          } else {
            addLog('INFO', `Команда '${cmd}' отправлена на сервер`);
          }
          break;
      }
    }

    // Autocomplete Logic
    function updateAutocomplete(val) {
      if (!val || val.startsWith('/')) {
        hideAutocomplete();
        return;
      }
      const needle = val.toLowerCase();
      filteredCommands = commandsList.filter(c => c.cmd.startsWith(needle));
      if (filteredCommands.length === 0 || (filteredCommands.length === 1 && filteredCommands[0].cmd === needle)) {
        hideAutocomplete();
        return;
      }

      acSelectedIndex = 0;
      let html = '';
      filteredCommands.forEach((c, idx) => {
        html += `<div class="ac-item ${idx === 0 ? 'selected' : ''}" onclick="applyAutocomplete('${c.cmd}')">
          <span><strong>${c.cmd}</strong></span>
          <span class="ac-desc">${c.desc}</span>
        </div>`;
      });
      acPopup.innerHTML = html;
      acPopup.style.display = 'flex';
    }

    function hideAutocomplete() {
      acPopup.style.display = 'none';
      acSelectedIndex = -1;
    }

    function applyAutocomplete(cmd) {
      cmdInput.value = cmd + ' ';
      hideAutocomplete();
      cmdInput.focus();
    }

    // Input Key Handling
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (acPopup.style.display === 'flex' && acSelectedIndex >= 0 && filteredCommands[acSelectedIndex]) {
          applyAutocomplete(filteredCommands[acSelectedIndex].cmd);
        } else {
          executeCommand(cmdInput.value);
          cmdInput.value = '';
        }
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (acPopup.style.display === 'flex' && acSelectedIndex >= 0 && filteredCommands[acSelectedIndex]) {
          applyAutocomplete(filteredCommands[acSelectedIndex].cmd);
        } else if (filteredCommands.length > 0) {
          applyAutocomplete(filteredCommands[0].cmd);
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (acPopup.style.display === 'flex') {
          acSelectedIndex = (acSelectedIndex - 1 + filteredCommands.length) % filteredCommands.length;
          updateAcSelection();
        } else {
          if (historyIndex > 0) {
            historyIndex--;
            cmdInput.value = history[historyIndex];
          }
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (acPopup.style.display === 'flex') {
          acSelectedIndex = (acSelectedIndex + 1) % filteredCommands.length;
          updateAcSelection();
        } else {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            cmdInput.value = history[historyIndex];
          } else {
            historyIndex = history.length;
            cmdInput.value = '';
          }
        }
      } else if (e.key === 'Escape' || e.key === 'F8' || e.key === 'F11' || e.keyCode === 119 || e.keyCode === 122) {
        e.preventDefault();
        closeConsole();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'F8' || e.key === 'F11' || e.keyCode === 119 || e.keyCode === 122) {
        e.preventDefault();
        closeConsole();
      }
    });

    cmdInput.addEventListener('input', (e) => {
      updateAutocomplete(e.target.value);
    });

    function updateAcSelection() {
      document.querySelectorAll('.ac-item').forEach((el, idx) => {
        el.classList.toggle('selected', idx === acSelectedIndex);
      });
    }

    // Draggable Window Logic
    (function makeDraggable() {
      const win = document.getElementById('console-window');
      const header = document.getElementById('window-header');
      let isDragging = false;
      let startX = 0, startY = 0;
      let startLeft = 0, startTop = 0;

      header.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        const rect = win.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;

        win.style.transform = 'none';
        win.style.left = startLeft + 'px';
        win.style.top = startTop + 'px';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let newX = startLeft + (e.clientX - startX);
        let newY = startTop + (e.clientY - startY);

        // Clamp to screen bounds
        newX = Math.max(10, Math.min(window.innerWidth - win.offsetWidth - 10, newX));
        newY = Math.max(10, Math.min(window.innerHeight - win.offsetHeight - 10, newY));

        win.style.left = newX + 'px';
        win.style.top = newY + 'px';
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    })();

    // alt:V Client Events
    if ('alt' in window) {
      alt.on('flovmp:console:log', (tag, text) => addLog(tag, text));
      alt.on('flovmp:console:stats', (fps, ping, tick) => {
        const fpsEl = document.getElementById('val-fps');
        const pingEl = document.getElementById('val-ping');
        const tickEl = document.getElementById('val-tick');
        if (fpsEl) fpsEl.innerText = fps;
        if (pingEl) pingEl.innerText = ping + ' ms';
        if (tickEl) tickEl.innerText = tick + ' Hz';
      });
    }

    // Initial load
    renderLogs();
    setTimeout(() => cmdInput.focus(), 60);
  </script>
</body>
</html>
