<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>FloV:MP — чат</title>
<script>
(function(){
  var PRESETS = {
    gold:{accent:'#fdd015',dim:'#b3790a',ink:'#1a1206'},
    pink:{accent:'#ff3d8a',dim:'#b3316f',ink:'#1a0410'},
    blue:{accent:'#4ac3ff',dim:'#2e8fdb',ink:'#031420'},
    green:{accent:'#3fd98a',dim:'#22b86b',ink:'#031b10'},
    purple:{accent:'#c084fc',dim:'#8b3fe8',ink:'#1a0f26'},
    red:{accent:'#ff5d5d',dim:'#c23a3a',ink:'#210404'}
  };
  var id = 'gold';
  try { id = localStorage.getItem('flovmp:accent') || 'gold'; } catch (e) {}
  var p = PRESETS[id] || PRESETS.gold;
  var s = document.documentElement.style;
  s.setProperty('--accent', p.accent);
  s.setProperty('--accent-dim', p.dim);
  s.setProperty('--accent-ink', p.ink);
})();
</script>
<style>
  :root {
    --accent: #fdd015;
    --sys: #e3b341;
    --me: #b98cff;
    --text0: #eef0f6;
    --text1: #aab0c2;
    --panel: rgba(15, 16, 21, .55);
    --stroke: rgba(255, 255, 255, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: transparent; color: var(--text0);
    overflow: hidden; user-select: none;
  }
  #chat {
    position: absolute; left: 20px; top: 20px;
    width: 460px;
  }
  #log {
    max-height: 260px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: 2px;
    font-size: 13px; line-height: 1.35;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
  }
  #log.dim { opacity: .35; transition: opacity .4s; }
  .line { word-wrap: break-word; }
  .line .who { font-weight: 600; }
  .line.system { color: var(--sys); }
  .line.me { color: var(--me); font-style: italic; }
  .line.player .who { color: var(--accent); }
  .line.shout { color: #ff9800; font-weight: 600; }
  .line.shout .who { color: #ffb74d; }
  .line.ooc { color: #90a4ae; font-style: italic; }

  #inputwrap {
    margin-top: 8px;
    display: none;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter: blur(4px);
  }
  #inputwrap.on { display: block; }
  #input {
    width: 100%;
    background: transparent; border: none; outline: none;
    color: var(--text0); font-size: 13px; font-family: inherit;
  }
</style>
</head>
<body>
<div id="chat">
  <div id="log" class="dim"></div>
  <div id="inputwrap"><input id="input" maxlength="256" autocomplete="off" /></div>
</div>

<script>
  var log = document.getElementById("log");
  var wrap = document.getElementById("inputwrap");
  var input = document.getElementById("input");
  var lines = [];
  var history = [];
  var historyIndex = -1;
  var dimTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatColors(s) {
    if (!s) return "";
    var safe = esc(s);
    var colorRegex = /\{([0-9a-fA-F]{6})\}/g;
    var openCount = 0;
    var res = safe.replace(colorRegex, function (match, hex) {
      openCount++;
      return '<span style="color: #' + hex + '">';
    });
    while (openCount > 0) {
      res += '</span>';
      openCount--;
    }
    return res;
  }

  function push(kind, author, text) {
    var el = document.createElement("div");
    el.className = "line " + kind;
    if (kind === "player") {
      el.innerHTML = '<span class="who">' + esc(author) + ':</span> ' + formatColors(text);
    } else if (kind === "shout") {
      el.innerHTML = '<span class="who">' + esc(author) + ':</span> ' + formatColors(text) + '!!';
    } else if (kind === "me") {
      el.innerHTML = '* ' + esc(author) + ' ' + formatColors(text);
    } else if (kind === "ooc") {
      el.innerHTML = '<span class="who">' + esc(author) + '</span> ' + formatColors(text);
    } else {
      el.innerHTML = formatColors(text);
    }
    log.appendChild(el);
    lines.push(el);
    while (lines.length > 50) { log.removeChild(lines.shift()); }
    wake();
  }

  function wake() {
    log.classList.remove("dim");
    if (dimTimer) clearTimeout(dimTimer);
    dimTimer = setTimeout(function () {
      if (!wrap.classList.contains("on")) log.classList.add("dim");
    }, 8000);
  }

  function openInput() {
    wrap.classList.add("on");
    log.classList.remove("dim");
    input.value = "";
    historyIndex = -1;
    input.focus();
  }

  function closeInput(send) {
    var v = input.value.trim();
    wrap.classList.remove("on");
    input.blur();
    wake();
    if (send && v.length > 0) {
      history.unshift(v);
      if (history.length > 30) history.pop();
      if (typeof alt !== "undefined") {
        alt.emit("flovmp:chat:say", v);
      }
    }
    if (typeof alt !== "undefined") {
      alt.emit("flovmp:chat:done");
    }
  }

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      closeInput(true);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeInput(false);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (history.length > 0 && historyIndex < history.length - 1) {
        historyIndex++;
        input.value = history[historyIndex];
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        input.value = history[historyIndex];
      } else if (historyIndex === 0) {
        historyIndex = -1;
        input.value = "";
      }
    }
  });

  if (typeof alt !== "undefined") {
    alt.on("flovmp:chat:msg", function (kind, author, text) { push(kind, author, text); });
    alt.on("chat:add", function (text) { push("system", "", text); });
    alt.on("chat:message", function (text) { push("system", "", text); });
    alt.on("chat:addMessage", function (text) { push("system", "", text); });
    alt.on("flovmp:chat:openinput", openInput);
    alt.on("flovmp:chat:clear", function () {
      log.innerHTML = "";
      lines = [];
    });
  } else {
    push("system", "", "{34d399}[FloV:MP]{ffffff} Тестовое сообщение с цветами в чате!");
    push("player", "Тестер", "привет мир /help");
  }
</script>
</body>
</html>
