<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>FloV:MP — Чат</title>
  <script>
    (function () {
      const PRESETS = {
        obsidian: { accent: '#ffffff', dim: '#a1a1aa', ink: '#09090b' },
        gold:     { accent: '#fdd015', dim: '#b3790a', ink: '#1a1206' },
        pink:     { accent: '#ff3d8a', dim: '#b3316f', ink: '#1a0410' },
        blue:     { accent: '#38bdf8', dim: '#0284c7', ink: '#031420' },
        green:    { accent: '#34d399', dim: '#059669', ink: '#031b10' },
        purple:   { accent: '#c084fc', dim: '#7c3aed', ink: '#1a0f26' },
        red:      { accent: '#f87171', dim: '#dc2626', ink: '#210404' },
        slate:    { accent: '#e4e4e7', dim: '#71717a', ink: '#09090b' }
      };
      let id = 'obsidian';
      try { id = localStorage.getItem('flovmp:accent') || 'obsidian'; } catch (e) {}
      const p = PRESETS[id] || PRESETS.obsidian;
      const s = document.documentElement.style;
      s.setProperty('--accent', p.accent);
      s.setProperty('--accent-dim', p.dim);
      s.setProperty('--accent-ink', p.ink);
    })();
  </script>
  <style>
    :root {
      --accent: #ffffff;
      --accent-dim: #a1a1aa;
      --accent-ink: #09090b;
      --bg-input: #0e0e12;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.28);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --text-dark: #52525b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Standalone Browser Preview Mode Background */
    body.standalone-preview {
      background: #09090b radial-gradient(circle at 40% 30%, #161620 0%, #09090b 100%);
      background-attachment: fixed;
    }

    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* ─── CHAT MAIN CONTAINER ─────────────────────────────────── */
    #chat-wrapper {
      position: absolute;
      left: 24px;
      top: 24px;
      width: 540px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    #chat-wrapper.interactive {
      pointer-events: auto;
    }

    /* ─── LOG CONTAINER (100% TRANSPARENT) ──────────────────────── */
    #log-container {
      position: relative;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    #log-area {
      max-height: 320px;
      min-height: 50px;
      padding: 4px 6px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 13px;
      line-height: 1.45;
      color: #f4f4f5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
      user-select: text;
      -webkit-user-select: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }

    #log-area::-webkit-scrollbar {
      width: 4px;
    }
    #log-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 3px;
    }

    /* Auto-dim state when inactive */
    #chat-wrapper.dimmed {
      opacity: 0.22;
    }
    #chat-wrapper:hover {
      opacity: 1 !important;
    }

    /* ─── MESSAGE ROWS (UNIFIED ACCENT / WHITE TYPOGRAPHY) ────── */
    .msg-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 2px 5px;
      border-radius: 4px;
      word-break: break-word;
      animation: chatRowIn 0.08s ease-out forwards;
      transition: background 0.08s ease;
    }
    .msg-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    @keyframes chatRowIn {
      from {
        opacity: 0;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-time {
      color: #71717a;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      flex-shrink: 0;
      letter-spacing: 0;
      line-height: 1.4;
      user-select: none;
    }

    .msg-body {
      flex: 1;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg-author {
      font-weight: 600;
      color: #ffffff;
      margin-right: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .msg-text {
      color: #f4f4f5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.9);
    }

    /* ─── INPUT PANEL (COMPACT OBSIDIAN FAST) ─────────────────── */
    #input-wrap {
      margin-top: 8px;
      display: none;
      background: #0e0e12;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      flex-direction: column;
      gap: 6px;
      animation: inputWrapIn 0.08s ease-out forwards;
      position: relative;
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
      overflow: visible;
    }

    #input-wrap.active {
      display: flex;
    }

    #input-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    @keyframes inputWrapIn {
      from {
        opacity: 0;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Tactile Send Flash */
    #input-wrap.input-send-flash {
      border-color: rgba(255, 255, 255, 0.55) !important;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.18), 0 20px 50px rgba(0, 0, 0, 0.8);
      transition: all 0.1s ease-out;
    }

    /* Input Field Row */
    .input-field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .input-prompt {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #71717a;
      flex-shrink: 0;
      user-select: none;
      transition: color 0.15s ease, transform 0.15s ease;
    }
    #input-wrap:focus-within .input-prompt {
      color: #ffffff;
      transform: translateX(1px);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 13.5px;
      font-family: inherit;
      line-height: 1.4;
      padding: 2px 0;
    }
    #chat-input::placeholder {
      color: #52525b;
      font-size: 13px;
    }

    /* Footer Meta */
    .input-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9.5px;
      color: #52525b;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 2;
    }

    .key-hints {
      display: flex;
      gap: 10px;
    }
    .key-hints span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    kbd {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 8.5px;
      font-family: inherit;
      color: #a1a1aa;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.2px;
    }

    .char-counter {
      font-family: ui-monospace, monospace;
    }
    .char-counter.warning {
      color: #fbbf24;
    }
    .char-counter.danger {
      color: #f87171;
    }

    /* ─── AUTOCOMPLETE POPUP (RAYCAST COMMAND MENU) ───────────── */
    #chat-autocomplete {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #111115;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2);
      max-height: 180px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      z-index: 100;
      padding: 4px;
      animation: acSlideUp 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes acSlideUp {
      from { opacity: 0; transform: translateY(4px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ac-item {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #a1a1aa;
      transition: background 0.12s ease, padding-left 0.14s ease, color 0.12s ease;
    }
    .ac-item:hover, .ac-item.selected {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding-left: 14px;
    }
    .ac-item strong {
      color: #ffffff;
    }
    .ac-desc {
      font-size: 9.5px;
      color: #71717a;
    }

    /* ─── STANDALONE PREVIEW TOOLBAR (ТОЛЬКО В БРАУЗЕРЕ) ───────── */
    #preview-toolbar {
      position: fixed;
      top: 20px;
      right: 24px;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(14, 14, 18, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 6px 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 9999;
      animation: pvIn 0.2s ease-out;
    }

    body.standalone-preview #preview-toolbar {
      display: flex;
    }

    @keyframes pvIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pv-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      padding-right: 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pv-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .pv-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pv-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d4d4d8;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
      white-space: nowrap;
      user-select: none;
    }
    .pv-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.22);
    }
    .pv-btn:active {
      transform: scale(0.96);
    }
    .pv-btn strong, .pv-btn span {
      color: #ffffff;
    }
  </style>
</head>
<body>
<!-- Standalone Browser Preview Toolbar -->
<div id="preview-toolbar" class="font-mono">
  <div class="pv-brand">
    <span class="pv-dot"></span>
    <span>FloV:MP Chat Preview</span>
  </div>
  <div class="pv-actions">
    <button class="pv-btn" onclick="toggleInputPreview()" title="Показать / скрыть поле ввода (клавиша T)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"></path></svg>
      Поле ввода (T)
    </button>
    <button class="pv-btn" onclick="seedSampleMessages()" title="Добавить тестовые сообщения">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Тест
    </button>
    <button class="pv-btn" onclick="clearLogs()" title="Очистить лог чата">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Очистить
    </button>
  </div>
</div>

<div id="chat-wrapper" class="dimmed">
  <div id="log-container">
    <div id="log-area"></div>
  </div>

  <div id="input-wrap">
    <!-- Autocomplete Popup -->
    <div id="chat-autocomplete"></div>

    <!-- Main Input Bar -->
    <div class="input-field-row">
      <span class="input-prompt font-mono">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </span>
      <input id="chat-input" maxlength="256" placeholder="Введите сообщение или команду (/)..." autocomplete="off" spellcheck="false" />
    </div>

    <!-- Footer Meta -->
    <div class="input-meta font-mono">
      <div class="key-hints">
        <span><kbd>↵ Enter</kbd> Отправить</span>
        <span><kbd>Esc</kbd> Закрыть</span>
        <span><kbd>↑↓</kbd> История</span>
        <span><kbd>Tab</kbd> Дополнить</span>
      </div>
      <div class="char-counter" id="char-counter">0 / 256</div>
    </div>
  </div>
</div>

<script>
  const chatWrapper = document.getElementById("chat-wrapper");
  const logArea = document.getElementById("log-area");
  const inputWrap = document.getElementById("input-wrap");
  const chatInput = document.getElementById("chat-input");
  const charCounter = document.getElementById("char-counter");
  const acPopup = document.getElementById("chat-autocomplete");

  const lines = [];
  const history = [];
  let historyIndex = -1;
  let dimTimer = null;
  let isInputOpen = false;

  const AUTOCOMPLETE_COMMANDS = [
    { cmd: 'help', desc: 'Список всех команд' },
    { cmd: 'pos', desc: 'Текущие координаты игрока' },
    { cmd: 'alogin', desc: 'Вход администратора (/alogin <пароль>)' },
    { cmd: 'claimowner', desc: 'Первичная активация прав (/claimowner <токен>)' },
    { cmd: 'clear', desc: 'Очистить историю чата' },
    { cmd: 'tpm', desc: 'Телепорт на метку карты (F5)' },
    { cmd: 'noclip', desc: 'Полет сквозь стены (F4 NoClip)' },
    { cmd: 'esp', desc: 'Админ-видение ESP Wallhack (F3)' },
    { cmd: 'revive', desc: 'Реанимировать игрока (/revive [id])' },
    { cmd: 'setadmin', desc: 'Назначить администратора (/setadmin <id> <0-8>)' },
    { cmd: 'car', desc: 'Создать транспорт (/car [model])' },
    { cmd: 'fix', desc: 'Починить транспорт' },
    { cmd: 'heal', desc: 'Восстановить 100% HP и брони' },
    { cmd: 'armor', desc: 'Установить броню (/armor [100])' },
    { cmd: 'god', desc: 'Режим бессмертия (GodMode)' },
    { cmd: 'tp', desc: 'Телепорт по координатам (/tp x y z)' },
    { cmd: 'goto', desc: 'Телепорт к игроку (/goto <id>)' },
    { cmd: 'gethere', desc: 'Телепорт игрока к себе (/gethere <id>)' },
    { cmd: 'weather', desc: 'Сменить погоду (/weather <type>)' },
    { cmd: 'time', desc: 'Установить время (/time <h> [m])' },
    { cmd: 'speed', desc: 'Множитель скорости бега (/speed <mult>)' },
    { cmd: 'setdim', desc: 'Сменить виртуальный мир (/setdim <dim>)' },
    { cmd: 'skin', desc: 'Сменить скин игрока (/skin <model>)' },
    { cmd: 'kick', desc: 'Исключить игрока с сервера (/kick <id> [причина])' },
    { cmd: 'a', desc: 'Внутренний чат администрации' },
    { cmd: 'me', desc: 'Действие персонажа (/me <действие>)' },
    { cmd: 'do', desc: 'Описание обстановки (/do <окружение>)' },
    { cmd: 'b', desc: 'Внеигровой OOC чат (/b <текст>)' },
    { cmd: 's', desc: 'Крикнуть (/s <текст>)' },
    { cmd: 'w', desc: 'Шепнуть игроку (/w <id> <текст>)' }
  ];

  let filteredAc = [];
  let acSelectedIndex = -1;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatColors(s) {
    if (!s) return "";
    let safe = esc(s);
    const colorRegex = /\{([0-9a-fA-F]{6})\}/g;
    let openCount = 0;
    let res = safe.replace(colorRegex, function (match, hex) {
      const prefix = openCount > 0 ? "</span>" : "";
      openCount = 1;
      return prefix + '<span style="color: #' + hex + '">';
    });
    if (openCount > 0) {
      res += '</span>';
    }
    return res;
  }

  function getFormattedTime() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
  }

  function pushMessage(kind, author, text) {
    const row = document.createElement("div");
    row.className = "msg-row";

    const time = getFormattedTime();
    let bodyHtml = '';

    if (author) {
      bodyHtml = `<span class="msg-author">${esc(author)}:</span><span class="msg-text">${formatColors(text)}</span>`;
    } else {
      bodyHtml = `<span class="msg-text">${formatColors(text)}</span>`;
    }

    row.innerHTML = `
      <span class="msg-time font-mono">[${time}]</span>
      <div class="msg-body">${bodyHtml}</div>
    `;

    const isNearBottom = (logArea.scrollHeight - logArea.scrollTop - logArea.clientHeight) < 60;
    logArea.appendChild(row);
    lines.push(row);

    while (lines.length > 70) {
      const old = lines.shift();
      if (old && old.parentNode) old.parentNode.removeChild(old);
    }

    if (isNearBottom || !isInputOpen) {
      logArea.scrollTop = logArea.scrollHeight;
    }

    wake();
  }

  function wake() {
    chatWrapper.classList.remove("dimmed");
    if (dimTimer) clearTimeout(dimTimer);
    dimTimer = setTimeout(function () {
      if (!isInputOpen) {
        chatWrapper.classList.add("dimmed");
      }
    }, 10000);
  }

  function openInput(initialValue = '') {
    isInputOpen = true;
    chatWrapper.classList.remove("dimmed");
    chatWrapper.classList.add("interactive");
    inputWrap.classList.add("active");

    chatInput.value = initialValue || '';
    historyIndex = -1;
    updateCharCounter();
    hideAutocomplete();

    // Scroll to bottom when opening input
    logArea.scrollTop = logArea.scrollHeight;

    setTimeout(() => {
      chatInput.focus();
      if (initialValue) {
        chatInput.setSelectionRange(initialValue.length, initialValue.length);
      }
    }, 20);
  }

  function closeInput(send) {
    const raw = chatInput.value.trim();
    hideAutocomplete();
    inputWrap.classList.remove("active");
    chatWrapper.classList.remove("interactive");
    isInputOpen = false;
    chatInput.blur();
    wake();

    if (send && raw.length > 0) {
      // Прямой выход из игры по командам
      var low = raw.toLowerCase();
      if (low === '/quit' || low === '/exit' || low === '/q') {
        if (typeof alt !== "undefined") {
          alt.emit("flovmp:chat:quit");
        }
        return;
      }

      // Tactile flash on submit
      inputWrap.classList.remove('input-send-flash');
      void inputWrap.offsetWidth;
      inputWrap.classList.add('input-send-flash');
      setTimeout(() => inputWrap.classList.remove('input-send-flash'), 200);

      // History
      history.unshift(raw);
      if (history.length > 30) history.pop();

      if (typeof alt !== "undefined") {
        alt.emit("flovmp:chat:say", raw);
      }
    }

    if (typeof alt !== "undefined") {
      alt.emit("flovmp:chat:done");
    }
  }

  function updateCharCounter() {
    const len = chatInput.value.length;
    charCounter.textContent = `${len} / 256`;
    charCounter.classList.toggle('warning', len >= 220 && len < 250);
    charCounter.classList.toggle('danger', len >= 250);
  }

  // ─── AUTOCOMPLETE (RAYCAST COMMAND MENU) ──────────────────────
  function updateAutocomplete(text) {
    if (!text.startsWith('/') || text.includes(' ')) {
      hideAutocomplete();
      return;
    }
    const q = text.slice(1).toLowerCase();
    filteredAc = AUTOCOMPLETE_COMMANDS.filter(item => item.cmd.toLowerCase().startsWith(q));

    if (filteredAc.length === 0) {
      hideAutocomplete();
      return;
    }

    acSelectedIndex = 0;
    let html = '';
    filteredAc.forEach((item, idx) => {
      html += `
        <div class="ac-item ${idx === 0 ? 'selected' : ''}" onmousedown="event.preventDefault(); applyAcItem('${item.cmd}')">
          <div style="display: flex; align-items: center; gap: 6px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            <strong>/${item.cmd}</strong>
          </div>
          <span class="ac-desc">${item.desc}</span>
        </div>
      `;
    });
    acPopup.innerHTML = html;
    acPopup.style.display = 'flex';
  }

  function hideAutocomplete() {
    acPopup.style.display = 'none';
    filteredAc = [];
    acSelectedIndex = -1;
  }

  function applyAcItem(cmd) {
    chatInput.value = `/${cmd} `;
    hideAutocomplete();
    updateCharCounter();
    chatInput.focus();
  }

  // ─── KEYBOARD & SCROLL HANDLERS ───────────────────────────────
  chatInput.addEventListener("input", function () {
    updateCharCounter();
    updateAutocomplete(chatInput.value);
  });

  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      closeInput(true);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeInput(false);
    } else if (e.key === "Tab") {
      e.preventDefault();
      if (filteredAc.length > 0 && acSelectedIndex >= 0) {
        applyAcItem(filteredAc[acSelectedIndex].cmd);
      }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (filteredAc.length > 0) {
        acSelectedIndex = (acSelectedIndex - 1 + filteredAc.length) % filteredAc.length;
        renderAcSelection();
      } else if (history.length > 0 && historyIndex < history.length - 1) {
        historyIndex++;
        chatInput.value = history[historyIndex];
        updateCharCounter();
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (filteredAc.length > 0) {
        acSelectedIndex = (acSelectedIndex + 1) % filteredAc.length;
        renderAcSelection();
      } else if (historyIndex > 0) {
        historyIndex--;
        chatInput.value = history[historyIndex];
        updateCharCounter();
      } else if (historyIndex === 0) {
        historyIndex = -1;
        chatInput.value = "";
        updateCharCounter();
      }
    } else if (e.key === "PageUp") {
      e.preventDefault();
      logArea.scrollBy({ top: -120, behavior: 'smooth' });
    } else if (e.key === "PageDown") {
      e.preventDefault();
      logArea.scrollBy({ top: 120, behavior: 'smooth' });
    }
  });

  function renderAcSelection() {
    const items = acPopup.querySelectorAll('.ac-item');
    items.forEach((item, idx) => {
      item.classList.toggle('selected', idx === acSelectedIndex);
    });
  }



  // Allow scrolling chat log with mouse wheel even when hovering
  chatWrapper.addEventListener('wheel', function (e) {
    logArea.scrollTop += e.deltaY;
  }, { passive: true });

  function toggleInputPreview() {
    if (isInputOpen) {
      closeInput(false);
    } else {
      openInput();
    }
  }

  function clearLogs() {
    logArea.innerHTML = "";
    lines.length = 0;
  }

  function seedSampleMessages() {
    clearLogs();
    pushMessage("system", "", "{34d399}[FloV:MP]{ffffff} Добро пожаловать на игровой сервер!");
    pushMessage("player", "[0] Alex_Mercer", "Привет всем! Сервер запущен автономно.");
    pushMessage("player", "[1] Roman_V", "Кто знает команду для списка возможностей?");
    pushMessage("player", "[0] Alex_Mercer", "Введи /help или /pos!");
    pushMessage("system", "", "{fde047}[Подсказка]{ffffff} Нажмите клавишу T для открытия чата, или / для ввода команд.");
    pushMessage("system", "", "{38bdf8}[Admin]{ffffff} Администратор Alex_Mercer авторизован.");
  }

  // ─── ALT:V CLIENT EVENTS ─────────────────────────────────────
  if (typeof alt !== "undefined") {
    alt.on("flovmp:chat:msg", function (kind, author, text) {
      pushMessage(kind, author, text);
    });
    alt.on("chat:add", function (text) {
      pushMessage("system", "", text);
    });
    alt.on("chat:message", function (author, text) {
      pushMessage("player", author, text);
    });
    alt.on("flovmp:chat:openinput", function (initialValue) {
      openInput(initialValue);
    });
    alt.on("flovmp:chat:clear", function () {
      clearLogs();
    });
    alt.on("flovmp:settings:accent", function (colorId) {
      const PRESETS = {
        obsidian: { accent: '#ffffff', dim: '#a1a1aa', ink: '#09090b' },
        gold:     { accent: '#fdd015', dim: '#b3790a', ink: '#1a1206' },
        pink:     { accent: '#ff3d8a', dim: '#b3316f', ink: '#1a0410' },
        blue:     { accent: '#38bdf8', dim: '#0284c7', ink: '#031420' },
        green:    { accent: '#34d399', dim: '#059669', ink: '#031b10' },
        purple:   { accent: '#c084fc', dim: '#7c3aed', ink: '#1a0f26' },
        red:      { accent: '#f87171', dim: '#dc2626', ink: '#210404' },
        slate:    { accent: '#e4e4e7', dim: '#71717a', ink: '#09090b' }
      };
      const p = PRESETS[colorId] || PRESETS.obsidian;
      const s = document.documentElement.style;
      s.setProperty('--accent', p.accent);
      s.setProperty('--accent-dim', p.dim);
      s.setProperty('--accent-ink', p.ink);
    });
  } else {
    // ─── Standalone Browser Preview Mode ────────────────────────
    document.body.classList.add("standalone-preview");

    // Hotkey T and / in standalone browser
    window.addEventListener("keydown", function (e) {
      if (e.target === chatInput) return;
      if (e.key === "t" || e.key === "T" || e.key === "е" || e.key === "Е") {
        e.preventDefault();
        openInput();
      } else if (e.key === "/") {
        e.preventDefault();
        openInput('/');
      }
    });

    // In standalone browser preview, send message to chat log directly on Enter
    const origCloseInput = closeInput;
    closeInput = function (send) {
      const raw = chatInput.value.trim();
      origCloseInput(send);
      if (send && raw.length > 0) {
        if (raw.startsWith('/')) {
          const cmd = raw.slice(1).split(' ')[0].toLowerCase();
          if (cmd === 'clear') {
            clearLogs();
          } else if (cmd === 'help') {
            pushMessage('system', '', '{38bdf8}─── СПИСОК КОМАНД СЕРВЕРА ───');
            pushMessage('system', '', '{e4e4e7}Чат: {a1a1aa}/clear, /pos, /alogin, /claimowner');
            pushMessage('system', '', '{34d399}Админ: {a1a1aa}/tpm (F5), /noclip (F4), /esp (F3), /revive, /car, /fix, /heal, /god, /tp, /setdim');
          } else {
            pushMessage('system', '', `{38bdf8}[Команда]{ffffff} Выполнена: ${raw}`);
          }
        } else {
          pushMessage('player', '[0] Вы', raw);
        }
      }
    };

    seedSampleMessages();

    // Auto-open input immediately in browser so the user sees the input field, hints & counter!
    setTimeout(() => {
      openInput();
    }, 40);
  }
</script>
</body>
</html>
