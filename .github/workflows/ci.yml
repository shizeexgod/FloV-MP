name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      # Сервер: сборка решения (геймод тянет AltV.Net из NuGet) + тесты
      # чистой логики (FloVMP.Core.Tests). assemble-runtime.ps1 в CI не
      # гоняем — нужен локальный бэкап alt:V.
      - name: Build server solution
        run: dotnet build server/FloVMP.slnx -c Release --nologo

      - name: Test server core
        run: dotnet test server/FloVMP.slnx -c Release --nologo --no-build

      # Лаунчер: сборка всех проектов + xUnit-тесты (Core-логика без WPF).
      - name: Build launcher solution
        run: dotnet build launcher/FloVMP.Launcher.slnx -c Release --nologo

      - name: Test launcher
        run: dotnet test launcher/FloVMP.Launcher.slnx -c Release --nologo --no-build
