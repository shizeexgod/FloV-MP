name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      # Сервер: сборка решения (геймод тянет AltV.Net из NuGet) + тесты
      # чистой логики (FloVMP.Core.Tests). assemble-runtime.ps1 в CI не
      # гоняем — нужен локальный бэкап alt:V.
      - name: Build server solution
        run: dotnet build server/FloVMP.sln -c Release --nologo

      - name: Test server core
        run: dotnet test server/FloVMP.sln -c Release --nologo --no-build

      # Лаунчер: сборка всех проектов + xUnit-тесты (Core-логика без WPF).
      - name: Build launcher solution
        run: dotnet build launcher/FloVMP.Launcher.slnx -c Release --nologo

      - name: Test launcher
        run: dotnet test launcher/FloVMP.Launcher.slnx -c Release --nologo --no-build

      - name: Parse b3889 diagnostic script
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/collect-legacy-3889-e2e.ps1 -Raw)) | Out-Null
          Write-Host 'collect-legacy-3889-e2e.ps1: syntax OK'

  portable-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          bash -n scripts/install.sh
          grep -q "install.ps1" scripts/pack_server.py
          grep -q "launcher/" scripts/pack_server.py
          grep -q '"deliveryMode": "runtime-license"' scripts/pack_server.py
          grep -q '"deliveryMode": "source-kit"' scripts/export_source.py
          python3 - <<'PY'
          import json
          with open('config/client-profiles/legacy-3889.json', encoding='utf-8') as f:
              client = json.load(f)
          with open('runtime/compat/legacy-3889/native-profile.json', encoding='utf-8') as f:
              native = json.load(f)
          assert client['supportStatus'] == native['supportStatus'] == 'needs-native-adapter'
          assert client['nativeClient']['requiredAdapter'] == 'flovmp-legacy-native-3889'
          print('compat profiles consistent')
          PY
          ! grep -RIl --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj \
            -E '(^|/)(web|launcher)/' scripts/package-templates source-kit

      - name: Verify separate source product export
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          python3 scripts/export_source.py --out "$out" --no-verify
          root="$out/flovmp-source-$(tr -d '\r\n' < VERSION)"
          python3 scripts/verify_source.py "$root"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          meta = json.loads((root / 'SOURCE-MANIFEST.json').read_text(encoding='utf-8'))
          assert meta['deliveryMode'] == 'source-kit'
          assert meta['sourceIncluded'] is True
          assert meta['launcherIncluded'] is False
          assert meta['webIncluded'] is False
          assert not (root / 'launcher').exists()
          assert not (root / 'web').exists()
          print('source product export: OK')
          PY

      - name: Run client simulations
        run: |
          node scripts/client-sim/entry_flow.test.mjs
          node scripts/client-sim/commands_sync.test.mjs
          node scripts/client-sim/admin_keys.test.mjs
